# ============================================================
# 线路监测配置
# 改完保存即生效（采集脚本每次运行都重新读取，不用重启服务）
# 也可以在浏览器打开 http://192.168.66.1/lm/config.html 在线修改
# ============================================================

# ---------------- 看板 ----------------
DASH_TITLE="线路质量监测看板"
DASH_SUBTITLE="移动蜂窝 eth1 + 电信 pppoe-wan2 + IPv6"

# ---------------- 出口定义 ----------------
# 每行一个出口，格式：接口名|显示名|源IP|mark值|类型
#   接口名  路由器上的网络接口，用于 ping -I / curl --interface
#   显示名  看板上显示的名字，不能有空格
#   源IP    测 HTTP 目标需要源地址策略路由时填。填 auto 表示自动取接口当前地址
#           （DHCP 出口必须用 auto——地址一变，写死的值就挂出一条不匹配任何流量的
#           空策略路由，包从本接口出去、回包走主表默认路由回来，TCP 握手会随机失败）。
#           不需要策略路由就留空。
#   mark    该出口在 conntrack 里的 fwmark，「实时TCP流」页靠它判断出口
#           多个用逗号分隔。可用 /usr/bin/lm_probe.sh 自动探测
#   类型    这个出口测什么：v4 = 只测 IPv4 目标，v6 = 只测 IPv6 目标，
#           both = 都测。留空按 both 算，老配置不用改。
#           看板按出口分标签页，类型决定那一页里有哪些曲线。
#
# 实测（2026-10-02，ip route get 验证）：
#   mark 256 -> dev eth1       （WAN，DHCP 192.168.8.114，蜂窝 CPE）
#   mark 512 -> dev pppoe-wan2 （WAN2，PPPoE，100.81.x.x）
#   mark 768 -> dev pppoe-wan2
EXITS="
eth1|移动|auto|256|both
pppoe-wan2|电信||512,768|both
"

# ---------------- 内网 ----------------
# 内网网段，用来挑出本网设备发起的 TCP 流。CIDR 形式，空格分隔可写多个：
#     LAN_NETS="192.168.66.0/24 10.0.0.0/8"
# 掩码不限 /24 —— /8 /16 /22 /25 /32 都按位比较，不会像前缀匹配那样把
# 192.168.66.0/24 之外的邻居段误算进来。
# 留空 = 自动识别：优先读 UCI 的 lan 接口（network.lan.ipaddr + netmask），
# 读不到就回落该接口 device 的实际地址（默认 br-lan）。换固件、换网段都不用改。
LAN_NETS=""

# ---------------- 监测目标 ----------------
# 格式：显示名:IP或域名（空格分隔多个目标）
# ICMP 类（DNS，不封 ICMP）
ICMP_TARGETS="阿里DNS:223.5.5.5 腾讯DNS:119.29.29.29 CNNIC:1.2.4.8"
# HTTP 类（网站/游戏，封 ICMP，测 TCP 连接耗时）
HTTP_TARGETS="微信:weixin.qq.com 淘宝:taobao.com B站:api.bilibili.com 抖音:douyin.com QQ:qq.com"
# IPv6 类
# 每条出口都会用「该出口自己的 v6 源地址」去 ping（见 line_monitor.sh 的 v6_src_of），
# 所以同一组目标同时反映移动与电信的 v6 质量。
#
# 挑目标的实测依据（2026-10-02，本机两条出口各测 3 包）：
#   2400:3200::1      阿里公共DNS   移动 0% 丢包 / 电信 0% 丢包   ✅
#   2409:8080:1::1    移动公共DNS   移动 0% / 电信 0%            ✅
#   2620:0:ccc::2     OpenDNS       移动 0% / 电信 0%            ✅
# 被换掉的旧值（都不回包，白白贡献 100% 丢包，误报「断网」）：
#   2402:4e00::       腾讯 DNSPod 的网段地址，实测 100% 丢包
#   2409:8080::8      移动网段地址，实测 100% 丢包
# 换了目标名就要连带清 history.log（目标名是统计表的分组键，改名会让一个目标裂成两行）。
ICMP6_TARGETS="阿里v6:2400:3200::1 移动v6:2409:8080:1::1 国际v6:2620:0:ccc::2"

# ---------------- 采集参数 ----------------
# ICMP 每次 ping 的包数
PING_COUNT=3
# curl 连接超时秒数
CURL_TIMEOUT=4
# history.log 保留行数（1440 ≈ 24 小时；每行约 530 字节，1440 行约 760KB）
KEEP_LINES=1440
# 域名解析用的公网 DNS（系统 DNS 走 tailscale 解析不了公网域名）
PUBLIC_DNS=223.5.5.5
# 采集间隔秒数（改这个要同时改 line_daemon.sh 的对应常量）
INTERVAL_MONITOR=60
INTERVAL_TCP=5

# 实时速率
# 采样间隔（秒）。速率是两次采样的字节差，间隔越小数字抖得越厉害，2 秒比较稳。
INTERVAL_RATE=2
# 要采速率的接口，空格分隔。留空就只采两条出口。
# 出口的显示名会自动从下面的 EXITS 里取，其余接口直接用接口名。
RATE_IFACES="eth1 pppoe-wan2 br-lan"

# ---------------- 看板统计表配色阈值 ----------------
# 只有看板前端用，不影响采集。单位毫秒。
# 「最大延迟」和「波动σ」超过 WARN 标橙色、超过 BAD 标红色。
# 各目标基线差异大（DNS 一二十毫秒、网站几百毫秒），按自己的线路调。
STAT_MAX_WARN=300
STAT_MAX_BAD=1000
STAT_SD_WARN=50
STAT_SD_BAD=200

# ---------------- 异常推送（Webhook）----------------
# 采集发现异常时推一条消息到手机/群里。判定逻辑和去抖在 /usr/bin/lm_alert.sh。
# 手工验证：  /usr/bin/lm_alert.sh --test     立刻发一条测试消息
#             /usr/bin/lm_alert.sh --status   看各目标当前是正常还是已告警

# 总开关。0 = 只采集不推送。
ALERT_ENABLE=0

# 推送类型，决定请求长什么样：
#   json        通用 POST，正文 {"title":"...","text":"..."}，URL 自己填
#   wecom       企业微信群机器人（URL 里已含 key，token 留空）
#   dingtalk    钉钉群机器人（URL 填到 access_token= 为止，token 填后面的值）
#   feishu      飞书群机器人（URL 里已含完整 hook）
#   serverchan  Server 酱（URL = https://sctapi.ftqq.com/<key>.send）
#   bark        iOS Bark（URL = https://api.day.app，token 填 device key）
#   telegram    URL 填 chat_id，token 填 bot token
ALERT_TYPE="json"
ALERT_URL=""
ALERT_TOKEN=""

# 单次延迟超过这个值（毫秒）算异常。留空则不看延迟。
ALERT_MAX_MS=300

# 连续几次异常才推第一条。默认 3 次 ≈ 3 分钟，用来滤掉偶发抖动
# （移动线路每隔几十分钟会有一次 1s 左右的抖动，单次就报会太吵）。
ALERT_DEBOUNCE=3

# 一直没恢复时，隔多少秒再提醒一次。0 = 只在首次和恢复时各推一条。
ALERT_COOLDOWN=1800

# 恢复正常时是否推一条「已恢复」。1 = 推。
ALERT_RECOVER=1

# 监测范围：v4（只报 IPv4 目标）/ v6 / all。
# 默认 v4 —— 当前移动和电信的 IPv6 目标常年不可达，全报会一直响。
ALERT_SCOPE="v4"

# 额外忽略的目标，空格分隔。可以写目标名（微信）、出口名（eth1）或整键（eth1|微信）。
# 例：ALERT_IGNORE="抖音 pppoe-wan2|QQ"
ALERT_IGNORE=""
