<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线路质量监测看板</title>
<script src="lib/chart.umd.min.js"></script>
<script src="lib/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="lib/hammer.min.js"></script>
<script src="lib/chartjs-plugin-zoom.min.js"></script>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e;
    --green:#3fb950; --red:#f85149; --orange:#d29922; --blue:#58a6ff;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:"Microsoft YaHei",system-ui,sans-serif; font-size:14px; }
  header { padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; }
  header .sub { color:var(--muted); font-size:12px; }
  #lastUpdate { margin-left:auto; color:var(--muted); font-size:12px; }
  header .cfg-link { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:5px;
    padding:3px 10px; text-decoration:none; white-space:nowrap; }
  header .cfg-link:hover { color:var(--blue); border-color:var(--blue); background:rgba(88,166,255,.08); }
  nav { display:flex; gap:4px; padding:10px 20px 0; flex-wrap:wrap; }
  nav button { background:var(--panel); color:var(--muted); border:1px solid var(--border); border-bottom:none;
    padding:8px 18px; cursor:pointer; font-size:13px; border-radius:6px 6px 0 0; }
  nav button.active { color:var(--text); border-color:var(--blue); border-bottom-color:var(--panel); }
  .tab { display:none; padding:16px 20px; }
  .tab.active { display:block; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:16px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px 16px; }
  .card .label { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .card .value { font-size:26px; font-weight:600; }
  .card .value.good { color:var(--green); } .card .value.bad { color:var(--red); } .card .value.warn { color:var(--orange); }
  .card .detail { color:var(--muted); font-size:11px; margin-top:4px; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:16px; }
  .panel h3 { font-size:13px; color:var(--muted); margin-bottom:10px; font-weight:500; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { padding:6px 10px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; position:sticky; top:0; background:var(--panel); }
  tr.syn_sent td { background:rgba(248,81,73,.12); color:#ffb3ae; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; }
  .badge.exit0 { background:rgba(88,166,255,.15); color:var(--blue); }
  .badge.exit1 { background:rgba(63,185,80,.15); color:var(--green); }
  .badge.unknown { background:rgba(139,148,158,.15); color:var(--muted); }
  .filters { display:flex; gap:14px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .filters select,.filters input { background:var(--bg); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 10px; font-size:12px; }
  #synCount { color:var(--red); font-weight:600; }
  .hint { color:var(--muted); font-size:12px; padding:8px 0; }
  .legend-note { color:var(--muted); font-size:11px; margin-top:8px; }

  /* 曲线开关 */
  .series-toggles { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .toggle-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border-radius:16px;
    cursor:pointer; border:1px solid var(--border); background:var(--bg); font-size:12px; user-select:none;
    transition:opacity .15s,border-color .15s; }
  .toggle-chip .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .toggle-chip.on { opacity:1; }
  .toggle-chip.off { opacity:.32; border-style:dashed; }
  .toggle-chip:hover { border-color:var(--blue); }
  .toggle-chip .val { color:var(--muted); font-variant-numeric:tabular-nums; }
  .toggle-actions { display:flex; gap:6px; margin-left:auto; }
  .toggle-actions button { background:var(--bg); color:var(--muted); border:1px solid var(--border);
    border-radius:6px; padding:3px 10px; cursor:pointer; font-size:11px; }
  .toggle-actions button:hover { color:var(--text); border-color:var(--blue); }

  /* 工具栏 */
  .timeline-bar { display:flex; align-items:center; gap:12px; margin-bottom:10px; background:var(--bg);
    border:1px solid var(--border); border-radius:8px; padding:10px 14px; flex-wrap:wrap; }
  .timeline-bar button { background:var(--panel); color:var(--muted); border:1px solid var(--border);
    border-radius:6px; padding:4px 12px; cursor:pointer; font-size:12px; white-space:nowrap; }
  .timeline-bar button:hover { color:var(--text); border-color:var(--blue); }
  .timeline-bar button.live { color:var(--green); border-color:var(--green); }
  .timeline-bar button.toggle-btn.on { color:var(--blue); border-color:var(--blue); background:rgba(88,166,255,.1); }

  /* 总览迷你图 */
  .spark-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:12px; margin-bottom:16px; }
  .spark-card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px;
    cursor:pointer; transition:border-color .15s; }
  .spark-card:hover { border-color:var(--blue); }
  .spark-card .spark-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .spark-card .spark-title { font-size:13px; font-weight:500; }
  .spark-card .spark-avg { font-size:11px; color:var(--muted); }
  .spark-card .spark-canvas { height:80px; position:relative; }

  /* 统计表 */
  .stat-head { display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex-wrap:wrap; margin-bottom:12px; }
  .stat-head h3 { margin:0; }
  .stat-wins { display:flex; gap:6px; }
  .stat-wins button { background:var(--bg); color:var(--muted); border:1px solid var(--border);
    border-radius:6px; padding:3px 11px; font-size:12px; cursor:pointer; white-space:nowrap; }
  .stat-wins button:hover { color:var(--text); border-color:var(--blue); }
  .stat-wins button.on { color:var(--blue); border-color:var(--blue); background:rgba(88,166,255,.1); }
  .stat-table { width:100%; border-collapse:collapse; font-size:13px; }
  .stat-table th { text-align:right; font-size:11px; color:var(--muted); font-weight:500;
    padding:6px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
  .stat-table th:first-child { text-align:left; }
  .stat-table td { padding:6px 10px; border-bottom:1px solid rgba(33,38,45,.5); }
  .stat-table tr:last-child td { border-bottom:none; }
  .stat-table .s-name { color:var(--text); }
  .stat-table .s-group { color:var(--text); font-weight:500; vertical-align:top;
    border-right:1px solid var(--border); white-space:nowrap; }
  .stat-table .s-num { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; }
  .stat-table .s-num.bad { color:var(--red); }
  .stat-table .s-num.warn { color:var(--orange); }
  .stat-note { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.6; }
</style>
</head>
<body>

<header>
  <h1 id="dashTitle">线路质量监测看板</h1>
  <span class="sub" id="dashSub"></span>
  <a class="cfg-link" href="config.html" title="配置出口、监测目标与采集参数">⚙ 设置</a>
  <span id="lastUpdate"></span>
</header>

<nav>
  <button class="active" data-tab="overview">总览</button>
  <button data-tab="wan1" id="navBtn1">出口1</button>
  <button data-tab="wan2" id="navBtn2">出口2</button>
  <button data-tab="ipv6">IPv6表</button>
  <button data-tab="tcp">实时TCP流</button>
</nav>

<div class="tab active" id="tab-overview">
  <div class="cards" id="overviewCards"></div>
  <div class="spark-grid" id="sparkGrid"></div>
  <div class="panel">
    <h3>各目标延迟对比（最新一次采集，ms）</h3>
    <canvas id="barChart" style="max-height:380px"></canvas>
    <div class="legend-note">ICMP 类目标若 100% 丢包为「DNS(ICMP)受限」，非线路故障</div>
  </div>
  <div class="panel" id="statBox-overview"></div>
</div>

<div class="tab" id="tab-wan1">
  <div class="panel">
    <div class="timeline-bar">
      <button id="liveBtn-wan1" class="live">● 实时</button>
      <button id="smoothBtn-wan1" class="toggle-btn" aria-pressed="false" title="平滑曲线：单调插值，不会超出相邻数据点">〰 平滑</button>
    </div>
    <div class="series-toggles" id="toggles-wan1"></div>
    <h3 id="hWan1"></h3>
    <div style="height:320px"><canvas id="chartWan1"></canvas></div>
  </div>
  <div class="panel" id="statBox-wan1"></div>
</div>

<div class="tab" id="tab-wan2">
  <div class="panel">
    <div class="timeline-bar">
      <button id="liveBtn-wan2" class="live">● 实时</button>
      <button id="smoothBtn-wan2" class="toggle-btn" aria-pressed="false" title="平滑曲线：单调插值，不会超出相邻数据点">〰 平滑</button>
    </div>
    <div class="series-toggles" id="toggles-wan2"></div>
    <h3 id="hWan2"></h3>
    <div style="height:320px"><canvas id="chartWan2"></canvas></div>
  </div>
  <div class="panel" id="statBox-wan2"></div>
</div>

<div class="tab" id="tab-ipv6">
  <div class="panel">
    <div class="timeline-bar">
      <button id="liveBtn-v6" class="live">● 实时</button>
      <button id="smoothBtn-v6" class="toggle-btn" aria-pressed="false" title="平滑曲线：单调插值，不会超出相邻数据点">〰 平滑</button>
    </div>
    <div class="series-toggles" id="toggles-v6"></div>
    <h3 id="hV6"></h3>
    <div style="height:320px"><canvas id="chartV6"></canvas></div>
  </div>
  <div class="panel" id="statBox-v6"></div>
</div>

<div class="tab" id="tab-tcp">
  <div class="panel">
    <div class="filters">
      <select id="fService" aria-label="按服务过滤"><option value="">全部服务</option></select>
      <select id="fIface" aria-label="按出口过滤"><option value="">全部出口</option></select>
      <input id="fClient" aria-label="按设备IP过滤" placeholder="设备IP过滤，如 192.168.66.24">
      <span class="hint" style="margin-left:4px">SYN_SENT（卡住的连接）<span id="synCount">0</span> 个</span>
      <span class="hint" id="tcpTime" style="margin-left:auto"></span>
    </div>
    <table id="tcpTable">
      <thead><tr><th>设备IP</th><th>源端口</th><th>目标IP</th><th>目标端口</th><th>出口</th><th>服务</th><th>状态</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
// ==================== 配置 ====================
const HIST_URL = 'history.log';
const TCP_URL  = 'tcp.json';
const CONFIG_URL = 'config.json';
const HIST_REFRESH = 60000;
const TCP_REFRESH  = 5000;
const LS_KEY = 'lm_visibility';
const LS_KEY_SMOOTH = 'lm_smooth';
const LS_KEY_STATWIN = 'lm_statwin';

// 内置默认值：读不到 config.json 时退回这套，保证看板永远能开
const DEFAULT_EXITS = [
  { if:'eth1',        label:'移动' },
  { if:'pppoe-wan2',  label:'电信' }
];
const DEFAULT_V4_TARGETS = ['阿里DNS','腾讯DNS','CNNIC','微信','淘宝','B站','字节','QQ'];
const DEFAULT_V6_TARGETS = ['阿里v6','腾讯v6','移动v6'];

// 出口的两个 key（第 1、第 2 个出口），由 config.json 的 exits 顺序决定
let EXIT1_KEY = 'eth1', EXIT2_KEY = 'pppoe-wan2';
let V61_KEY = 'v6-eth1', V62_KEY = 'v6-pppoe-wan2';
let V4_TARGETS = DEFAULT_V4_TARGETS.slice();
let V6_TARGETS = DEFAULT_V6_TARGETS.slice();
let EXITS = DEFAULT_EXITS.slice();

// 统计表配色阈值（毫秒），由 config.json 覆盖。只有前端用，不影响采集。
// 「最大延迟」看有没有偶发卡死，「波动σ」看这条线路稳不稳，各目标基线差异大所以要可调。
let TH_MAX_WARN = 300, TH_MAX_BAD = 1000;
let TH_SD_WARN = 50, TH_SD_BAD = 200;

const PALETTE = ['#58a6ff','#3fb950','#d29922','#f778ba','#a371f7','#76e3ea','#ffa657','#8b949e','#ff7b72','#79c0ff','#56d364'];

// 接口名 -> 看板显示名（未知接口原样返回）
function labelOf(iface) {
  if (!iface) return '';
  const hit = EXITS.find(e => e.if === iface);
  if (hit) return hit.label;
  if (iface === '未知') return '未知';
  return iface;
}
// 出口 -> 徽章 class。按出口序号配色，用户改成什么名字都有对应样式
function badgeClassOf(iface) {
  const i = EXITS.findIndex(e => e.if === iface);
  return i >= 0 ? 'exit' + i : 'unknown';
}

// 拉取 /www/lm/config.json（由 lm_config_json.sh 从 targets.conf 生成）
async function loadConfig() {
  try {
    const r = await fetch(CONFIG_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const cfg = await r.json();
    if (cfg.title) document.getElementById('dashTitle').textContent = cfg.title;
    document.title = (cfg.title || '线路质量监测看板');
    if (cfg.subtitle) document.getElementById('dashSub').textContent = cfg.subtitle;
    if (Array.isArray(cfg.exits) && cfg.exits.length) EXITS = cfg.exits;
    if (Array.isArray(cfg.targets_v4) && cfg.targets_v4.length) V4_TARGETS = cfg.targets_v4;
    if (Array.isArray(cfg.targets_v6) && cfg.targets_v6.length) V6_TARGETS = cfg.targets_v6;
    const pos = (v, d) => (typeof v === 'number' && isFinite(v) && v > 0 ? v : d);
    TH_MAX_WARN = pos(cfg.th_max_warn, TH_MAX_WARN);
    TH_MAX_BAD  = pos(cfg.th_max_bad,  TH_MAX_BAD);
    TH_SD_WARN  = pos(cfg.th_sd_warn,  TH_SD_WARN);
    TH_SD_BAD   = pos(cfg.th_sd_bad,   TH_SD_BAD);
  } catch (e) {
    console.warn('config.json 读取失败，用内置默认值:', e.message);
  }
  const e1 = EXITS[0] || DEFAULT_EXITS[0];
  const e2 = EXITS[1] || DEFAULT_EXITS[1];
  EXIT1_KEY = e1.if; EXIT2_KEY = e2.if;
  V61_KEY = 'v6-' + e1.if; V62_KEY = 'v6-' + e2.if;
  applyConfigToDom();
}

// 把配置写进静态 DOM（标题下方的 tab 名、曲线小标题、出口下拉）
function applyConfigToDom() {
  const e1 = EXITS[0] || DEFAULT_EXITS[0];
  const e2 = EXITS[1] || DEFAULT_EXITS[1];
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };

  set('navBtn1', e1.label + '表');
  set('navBtn2', e2.label + '表');
  set('hWan1', labelOf(EXIT1_KEY) + ' (' + EXIT1_KEY + ') → 各目标延迟曲线');
  set('hWan2', labelOf(EXIT2_KEY) + ' (' + EXIT2_KEY + ') → 各目标延迟曲线');
  set('hV6', labelOf(EXIT1_KEY) + 'v6 / ' + labelOf(EXIT2_KEY) + 'v6 → v6 DNS 目标延迟曲线');
  if (!document.getElementById('dashSub').textContent) {
    set('dashSub', labelOf(EXIT1_KEY) + ' ' + EXIT1_KEY + ' + ' + labelOf(EXIT2_KEY) + ' ' + EXIT2_KEY + ' + IPv6');
  }
  // tab 按钮的 data-tab 不变，只换文字
  const sel = document.getElementById('fIface');
  const keep = sel.value;
  sel.innerHTML = '<option value="">全部出口</option>' +
    EXITS.map(e => '<option>' + e.label + '</option>').join('') +
    '<option>未知</option>';
  sel.value = keep;
}


// ==================== 状态 ====================
let histData = [];
let tcpData = { ts:0, streams:[] };
let charts = {};
const chartState = {};   // tabKey -> { defs, visible:Set, sliderIdx, isLive }
let smoothOn = false;    // 平滑曲线开关（全局，三个曲线标签页共用）

// ==================== 工具 ====================
function pad(n) { return String(n).padStart(2,'0'); }
function fmtTime(ts) { const d = new Date(ts*1000); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtFull(ts) {
  const d = new Date(ts*1000);
  return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtTime(ts)+':'+pad(d.getSeconds());
}
function avg(a) { return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function lastValue(key) {
  for (let i = histData.length-1; i >= 0; i--) {
    const s = histData[i].series[key];
    if (s && s.value !== null) return s.value;
  }
  return null;
}
function valAt(key, idx) {
  // 取 <= idx 的最近一个有效值（用于开关 chip 显示当前时刻的值）
  for (let i = Math.min(idx, histData.length-1); i >= 0; i--) {
    const s = histData[i].series[key];
    if (s && s.value !== null) return s.value;
  }
  return null;
}

// ==================== 解析 history.log ====================
function parseHistory(text) {
  const out = [];
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    const parts = t.split(/\s+/);
    const ts = Number(parts[0]);
    if (!ts) continue;
    const series = {};
    for (let i = 1; i < parts.length; i++) {
      const m = parts[i].match(/^([^|]+)\|([^=]+)=([^,]+),(.+)$/);
      if (!m) continue;
      series[m[1] + '|' + m[2]] = {
        value: m[3] === 'FAIL' ? null : Number(m[3]),
        status: m[4]
      };
    }
    out.push({ ts, series });
  }
  return out;
}

// ==================== 失败红点 plugin ====================
// 用时间戳定位像素坐标，避免数据断点导致索引错位
const failDotPlugin = {
  id: 'failDots',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    const xs = chart.scales.x, ys = chart.scales.y;
    chart.data.datasets.forEach((ds, di) => {
      if (!ds._fails || !ds._fails.length) return;
      if (!chart.isDatasetVisible(di)) return;
      ctx.save();
      ds._fails.forEach(f => {
        const px = xs.getPixelForValue(f.x);
        const py = ys.getPixelForValue(f.y);
        if (!isFinite(px) || !isFinite(py)) return;
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI*2);
        ctx.fillStyle = '#f85149';
        ctx.fill();
        ctx.strokeStyle = '#0d1117';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
      ctx.restore();
    });
  }
};
Chart.register(failDotPlugin);

// ==================== 数据集构建 ====================
// endIdx: null/undefined = 全部数据（实时）；数字 = 只画到该索引（回放）
function buildDatasets(defs, endIdx) {
  const sliceAll = (endIdx === null || endIdx === undefined);
  const slice = sliceAll ? histData : histData.slice(0, endIdx + 1);
  return defs.map(def => {
    const points = [];
    const fails = [];
    let lastY = null;
    let inFail = false;
    slice.forEach(d => {
      const s = d.series[def.key];
      if (!s) return;
      if (s.value !== null) {
        points.push({ x: d.ts * 1000, y: s.value });
        lastY = s.value;
        inFail = false;
      } else if (!inFail) {
        // 连续丢包只在段起点标一个红点；y 取最近有效值，从未成功过则落底
        fails.push({ x: d.ts * 1000, y: lastY !== null ? lastY : 0 });
        inFail = true;
      }
    });
    return {
      label: def.label,
      data: points,
      borderColor: def.color,
      backgroundColor: def.color,
      borderWidth: 1.6,
      borderDash: def.dash || [],
      pointRadius: 0,
      pointHoverRadius: 4,
      pointHitRadius: 10,
      tension: smoothOn ? 0.4 : 0,
      cubicInterpolationMode: smoothOn ? 'monotone' : 'default',
      spanGaps: false,
      _color: def.color,
      _fails: fails
    };
  });
}

// ==================== 缩放边界 ====================
// 缩放/平移不许越过实际数据范围：右边界最多到最新一个采集点，左边界最多到最早一个点，
// 拖不出空白区域。
//
// 为什么不用插件自带的 limits：'original' 会把范围锁死在页面加载那一刻，之后新采集的
// 点会被挤出画面（实测数据涨到 04:02 而轴停在 03:52）；'data' 这个关键字 2.0.1 不认。
// 所以在每次缩放/平移结束后自己夹一次。
let clampingX = false;
function clampXToData(chart) {
  if (clampingX || !chart) return;
  const all = chart.data.datasets.flatMap(d => d.data.map(p => p.x));
  if (all.length < 2) return;
  const dMin = Math.min(...all), dMax = Math.max(...all);
  const xs = chart.scales.x;
  if (xs.min >= dMin && xs.max <= dMax) return;   // 已经在范围内，不用动
  let a = Math.max(xs.min, dMin);
  let b = Math.min(xs.max, dMax);
  if (b - a < 60000) { a = dMin; b = dMax; }      // 夹得比一分钟还窄就直接还原全范围
  clampingX = true;
  chart.zoomScale('x', { min: a, max: b }, 'none');
  setTimeout(() => { clampingX = false; }, 0);
}

// ==================== 折线图通用配置 ====================
function lineOptions() {
  return {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    interaction: { mode: 'nearest', axis: 'x', intersect: false },
    plugins: {
      legend: { display: false },   // 用自绘 chip 代替
      tooltip: {
        backgroundColor: '#1c2128', borderColor: '#30363d', borderWidth: 1,
        titleColor: '#e6edf3', bodyColor: '#adbac7', padding: 10,
        callbacks: {
          title: items => items.length ? fmtFull(items[0].parsed.x / 1000) : '',
          label: item => {
            const ds = item.dataset;
            return ' ' + ds.label + ': ' + (item.parsed.y === null ? '失败' : item.parsed.y + ' ms');
          }
        }
      },
      zoom: {
        pan: {
          enabled: true, mode: 'x', modifierKey: 'shift',
          onPanComplete: ({ chart }) => clampXToData(chart)
        },
        zoom: {
          wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x',
          onZoomComplete: ({ chart }) => clampXToData(chart)
        }
      }
    },
    scales: {
      x: {
        type: 'time',
        time: { tooltipFormat: 'MM-dd HH:mm:ss', displayFormats: { minute:'HH:mm', hour:'MM-dd HH:mm' } },
        ticks: { color: '#8b949e', maxTicksLimit: 12, font: { size: 11 }, autoSkip: true },
        grid: { color: '#21262d' }
      },
      y: {
        beginAtZero: true,
        ticks: { color: '#8b949e', font: { size: 11 } },
        grid: { color: '#21262d' },
        title: { display: true, text: 'ms', color: '#8b949e' }
      }
    }
  };
}

// ==================== 图表定义（每个 tab 的曲线来源）====================
function tabDefs(tabKey) {
  if (tabKey === 'wan1') {
    return V4_TARGETS.map((t, i) => ({ label: t, key: EXIT1_KEY + '|' + t, color: PALETTE[i % PALETTE.length] }));
  }
  if (tabKey === 'wan2') {
    return V4_TARGETS.map((t, i) => ({ label: t, key: EXIT2_KEY + '|' + t, color: PALETTE[i % PALETTE.length] }));
  }
  // v6: 第一个出口实线 + 第二个出口虚线，同一目标共用颜色
  const defs = [];
  const l1 = labelOf(EXIT1_KEY), l2 = labelOf(EXIT2_KEY);
  V6_TARGETS.forEach((t, i) => {
    const c = PALETTE[i % PALETTE.length];
    defs.push({ label: l1 + 'v6·' + t, key: V61_KEY + '|' + t, color: c, dash: [] });
    defs.push({ label: l2 + 'v6·' + t, key: V62_KEY + '|' + t, color: c, dash: [5,4] });
  });
  return defs;
}

// ==================== 可见性持久化 ====================
function loadVis() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; } }
function saveVis() {
  const o = {};
  for (const k in chartState) o[k] = [...chartState[k].visible];
  try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) {}
}

// ==================== 曲线开关 ====================
function renderToggles(tabKey) {
  const st = chartState[tabKey];
  const box = document.getElementById('toggles-' + tabKey);
  box.innerHTML = '';
  st.valEls = {};

  st.defs.forEach(def => {
    const chip = document.createElement('span');
    chip.className = 'toggle-chip ' + (st.visible.has(def.label) ? 'on' : 'off');
    chip.style.color = def.color;
    const shown = st.visible.has(def.label);
    chip.innerHTML =
      '<span class="dot" style="background:' + def.color + '"></span>' +
      '<span style="color:' + (shown ? '#e6edf3' : '#8b949e') + '">' + def.label + '</span>' +
      '<span class="val"></span>';
    chip.title = '点击显示/隐藏该曲线';
    st.valEls[def.label] = chip.querySelector('.val');
    chip.addEventListener('click', () => {
      if (st.visible.has(def.label)) st.visible.delete(def.label);
      else st.visible.add(def.label);
      applyVisibility(tabKey);
      renderToggles(tabKey);
      saveVis();
    });
    box.appendChild(chip);
  });

  // 全开 / 全关
  const actions = document.createElement('span');
  actions.className = 'toggle-actions';
  const btnAll = document.createElement('button');
  btnAll.textContent = '全选';
  btnAll.addEventListener('click', () => {
    st.defs.forEach(d => st.visible.add(d.label));
    applyVisibility(tabKey); renderToggles(tabKey); saveVis();
  });
  const btnNone = document.createElement('button');
  btnNone.textContent = '全不选';
  btnNone.addEventListener('click', () => {
    st.visible.clear();
    applyVisibility(tabKey); renderToggles(tabKey); saveVis();
  });
  actions.append(btnAll, btnNone);
  box.appendChild(actions);

  refreshToggleValues(tabKey);
}

// 只刷新开关上的数值文本，不重建 DOM（避免打断悬停/点击）
function refreshToggleValues(tabKey) {
  const st = chartState[tabKey];
  if (!st || !st.valEls) return;
  const curIdx = st.isLive ? histData.length - 1 : st.sliderIdx;
  st.defs.forEach(def => {
    const el = st.valEls[def.label];
    if (!el) return;
    const v = valAt(def.key, curIdx);
    el.textContent = v === null ? '—' : Math.round(v) + 'ms';
  });
}

function applyVisibility(tabKey) {
  const st = chartState[tabKey];
  const chart = charts[tabKey];
  if (!chart) return;
  chart.data.datasets.forEach((ds, i) => {
    chart.setDatasetVisibility(i, st.visible.has(ds.label));
  });
  chart.update('none');
}

// ==================== 绘制 / 刷新 ====================
function drawChart(tabKey) {
  const st = chartState[tabKey];
  const endIdx = st.isLive ? null : st.sliderIdx;
  const datasets = buildDatasets(st.defs, endIdx);
  const chart = charts[tabKey];
  chart.data.datasets = datasets;
  datasets.forEach((ds, i) => chart.setDatasetVisibility(i, st.visible.has(ds.label)));
  chart.update('none');
}

// ==================== 平滑开关 ====================
// 开启后用单调三次插值画曲线：视觉圆滑，但曲线永远不会越过相邻数据点的值，
// 既不会把尖刺画得比真实更高，也不会在低点之间画到负数。
// 关掉就是折线，尖刺的陡峭程度看得最准。红点（失败标记）两种模式都不受影响。
function loadSmooth() {
  try { return localStorage.getItem(LS_KEY_SMOOTH) === '1'; } catch (e) { return false; }
}
function syncSmoothButtons() {
  ['wan1','wan2','v6'].forEach(k => {
    const btn = document.getElementById('smoothBtn-' + k);
    if (!btn) return;
    btn.classList.toggle('on', smoothOn);
    btn.setAttribute('aria-pressed', smoothOn ? 'true' : 'false');
  });
}
function applySmooth() {
  syncSmoothButtons();
  ['wan1','wan2','v6'].forEach(k => { if (charts[k]) drawChart(k); });
  renderSparks();
}
function setSmooth(on) {
  smoothOn = on;
  try { localStorage.setItem(LS_KEY_SMOOTH, on ? '1' : '0'); } catch (e) {}
  applySmooth();
}

// ==================== 实时状态 ====================
// 时间显示、播放、重置缩放三个控件已移除，图表始终画全量数据。
// 缩放后想还原，双击图表即可。
function setupTimeline(tabKey) {
  const st = chartState[tabKey];
  const liveBtn = document.getElementById('liveBtn-' + tabKey);

  // 没有时间显示控件了，保留空实现给 loadHist 等调用点
  st.syncTimeline = function () {};

  function setLive(on) {
    st.isLive = on;
    liveBtn.classList.toggle('live', on);
    if (on) st.sliderIdx = Math.max(0, histData.length - 1);
    st.syncTimeline();
    drawChart(tabKey);
    refreshToggleValues(tabKey);
  }
  st.setLive = setLive;

  liveBtn.addEventListener('click', () => setLive(true));
}

// ==================== 初始化一个折线标签页 ====================
function initLineTab(tabKey, canvasId) {
  const defs = tabDefs(tabKey);
  const saved = loadVis()[tabKey];
  const visible = new Set();
  defs.forEach(d => {
    if (saved && saved.length) { if (saved.includes(d.label)) visible.add(d.label); }
    else visible.add(d.label);
  });
  chartState[tabKey] = { defs, visible, sliderIdx: 0, isLive: true };

  charts[tabKey] = new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { datasets: buildDatasets(defs, null) },
    options: lineOptions()
  });
  const cv = document.getElementById(canvasId);
  // 移动端双指缩放需要触摸事件
  cv.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // 重置缩放按钮已移除，改成双击图表还原
  cv.addEventListener('dblclick', () => { charts[tabKey]?.resetZoom(); });

  applyVisibility(tabKey);
  setupTimeline(tabKey);
  renderToggles(tabKey);
}

// ==================== 统计 ====================
const STAT_WINDOWS = [
  { k:'1h',  label:'1 小时',  sec:3600 },
  { k:'6h',  label:'6 小时',  sec:21600 },
  { k:'24h', label:'24 小时', sec:86400 },
  { k:'all', label:'全部',    sec:null }
];
let statWin = '1h';

function loadStatWin() {
  try {
    const v = localStorage.getItem(LS_KEY_STATWIN);
    if (STAT_WINDOWS.some(w => w.k === v)) statWin = v;
  } catch (e) {}
}
function syncStatWinButtons() {
  document.querySelectorAll('.stat-wins button').forEach(b => {
    const on = b.dataset.w === statWin;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
function setStatWin(k) {
  statWin = k;
  try { localStorage.setItem(LS_KEY_STATWIN, k); } catch (e) {}
  renderStats();
}

// 线性插值分位数，p 取 0~1
function pctOf(sorted, p) {
  const n = sorted.length;
  if (!n) return null;
  if (n === 1) return sorted[0];
  const idx = (n - 1) * p;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}

function statWindowFrom() {
  const w = STAT_WINDOWS.find(x => x.k === statWin);
  if (!w || w.sec === null || !histData.length) return 0;
  return histData[histData.length - 1].ts - w.sec;
}

// keys 可以是单个 key 字符串，也可以是数组（把多个目标合并统计）
function statFor(keys) {
  if (typeof keys === 'string') keys = [keys];
  const from = statWindowFrom();
  const vals = [];
  let records = 0, lossSum = 0;
  for (let i = 0; i < histData.length; i++) {
    const d = histData[i];
    if (d.ts < from) continue;
    for (const k of keys) {
      const s = d.series[k];
      if (!s) continue;
      records++;
      if (s.value !== null) vals.push(s.value);
      const st = Number(s.status);
      lossSum += isFinite(st) ? st : (s.value === null ? 100 : 0);
    }
  }
  vals.sort((a, b) => a - b);
  const mean = vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : null;
  let sd = null;
  if (vals.length > 1) {
    const v = vals.reduce((s, x) => s + (x - mean) * (x - mean), 0) / (vals.length - 1);
    sd = Math.sqrt(v);
  }
  return {
    records, ok: vals.length,
    loss: records ? lossSum / records : null,
    avg: mean, p50: pctOf(vals, .50), p95: pctOf(vals, .95), p99: pctOf(vals, .99),
    max: vals.length ? vals[vals.length - 1] : null, sd
  };
}

function fmtMsCell(v) {
  return v === null ? '—' : (v < 100 ? (Math.round(v * 10) / 10) + '' : Math.round(v) + '');
}

// 阈值配色：超过 warn 橙色，超过 bad 红色。阈值来自配置，可按线路基线调。
function thCls(v, warn, bad) {
  if (v === null || !isFinite(v)) return '';
  if (bad > 0 && v >= bad) return ' bad';
  if (warn > 0 && v >= warn) return ' warn';
  return '';
}

function statRowsFor(tabKey) {
  if (tabKey === 'wan1') return V4_TARGETS.map(t => ({ label:t, keys: EXIT1_KEY + '|' + t }));
  if (tabKey === 'wan2') return V4_TARGETS.map(t => ({ label:t, keys: EXIT2_KEY + '|' + t }));
  if (tabKey === 'v6') {
    const rows = [];
    V6_TARGETS.forEach(t => {
      rows.push({ label: labelOf(EXIT1_KEY) + 'v6 · ' + t, keys: V61_KEY + '|' + t });
      rows.push({ label: labelOf(EXIT2_KEY) + 'v6 · ' + t, keys: V62_KEY + '|' + t });
    });
    return rows;
  }
  // overview：每条线路 × 每个目标，一整张表
  const l1 = labelOf(EXIT1_KEY), l2 = labelOf(EXIT2_KEY);
  const rows = [];
  V4_TARGETS.forEach(t => rows.push({ group: l1, label: t, keys: EXIT1_KEY + '|' + t }));
  V4_TARGETS.forEach(t => rows.push({ group: l2, label: t, keys: EXIT2_KEY + '|' + t }));
  V6_TARGETS.forEach(t => rows.push({ group: l1 + '·v6', label: t, keys: V61_KEY + '|' + t }));
  V6_TARGETS.forEach(t => rows.push({ group: l2 + '·v6', label: t, keys: V62_KEY + '|' + t }));
  return rows;
}

function statCells(r) {
  const s = statFor(r.keys);
  // 丢包率配色：<0.05% 算作干净（不标色）；<1% 用橙色提示；>=1% 才是红色告警。
  // 以前一律 loss>0 就标红，会把四舍五入后显示成 0.0% 的极小值也烧成红色，自相矛盾。
  const lossTxt = s.loss === null ? '—'
    : (s.loss < 0.05 ? '0%'
      : (s.loss < 1 ? s.loss.toFixed(1) : Math.round(s.loss)) + '%');
  const lossCls = (s.loss === null || s.loss < 0.05) ? ''
    : (s.loss < 1 ? ' warn' : ' bad');
  return '<td class="s-name">' + r.label + '</td>'
    + '<td class="s-num">' + s.ok + ' / ' + s.records + '</td>'
    + '<td class="s-num' + lossCls + '">' + lossTxt + '</td>'
    + '<td class="s-num">' + fmtMsCell(s.avg) + '</td>'
    + '<td class="s-num">' + fmtMsCell(s.p50) + '</td>'
    + '<td class="s-num">' + fmtMsCell(s.p95) + '</td>'
    + '<td class="s-num">' + fmtMsCell(s.p99) + '</td>'
    + '<td class="s-num' + thCls(s.max, TH_MAX_WARN, TH_MAX_BAD) + '">' + fmtMsCell(s.max) + '</td>'
    + '<td class="s-num' + thCls(s.sd,  TH_SD_WARN,  TH_SD_BAD)  + '">' + fmtMsCell(s.sd) + '</td>';
}

const STAT_TABS = ['overview', 'wan1', 'wan2', 'v6'];
function renderStats() {
  STAT_TABS.forEach(tabKey => {
    const box = document.getElementById('statBox-' + tabKey);
    if (!box) return;
    const rows = statRowsFor(tabKey);
    const showGroup = tabKey === 'overview';

    // 连续相同 group 的行合并成一格
    let body = '';
    for (let i = 0; i < rows.length; ) {
      const g = rows[i].group;
      let span = 1;
      while (i + span < rows.length && rows[i + span].group === g) span++;
      for (let j = 0; j < span; j++) {
        body += '<tr>'
          + (showGroup && j === 0 ? '<td class="s-group" rowspan="' + span + '">' + g + '</td>' : '')
          + statCells(rows[i + j])
          + '</tr>';
      }
      i += span;
    }

    const wins = STAT_WINDOWS.map(w =>
      '<button data-w="' + w.k + '" aria-pressed="' + (w.k === statWin) + '">' + w.label + '</button>').join('');
    box.innerHTML =
      '<div class="stat-head"><h3>统计 · 每个监测目标</h3><div class="stat-wins">' + wins + '</div></div>'
      + '<table class="stat-table"><thead><tr>'
      + (showGroup ? '<th>线路</th>' : '')
      + '<th>目标</th><th>样本(有效/总)</th><th>丢包率</th><th>平均</th>'
      + '<th>p50</th><th>p95</th><th>p99</th><th>最大</th><th>波动σ</th>'
      + '</tr></thead><tbody>' + body + '</tbody></table>'
      + '<div class="stat-note">「样本」是窗口内的成功次数 / 总采集次数。丢包率取每次采集的丢包百分比的平均；'
      + '平均与分位数只统计成功样本，波动σ 是它们的标准差。'
      + 'ICMP 类目标若被运营商限制会显示成高丢包，那是限制不是线路故障。</div>';
  });
  syncStatWinButtons();
}

// 统计时间窗切换（事件委托：表格每次重建，按钮不单独绑事件）

  defs.forEach(def => {

    card.className = 'spark-card';
    card.innerHTML =
      '<div class="spark-head"><span class="spark-title">' + def.title + '</span>' +

      borderWidth: 1.2, pointRadius: 0,
      tension: smoothOn ? 0.4 : 0,
      cubicInterpolationMode: smoothOn ? 'monotone' : 'default',
      spanGaps: false
    }));
    const all = datasets.flatMap(ds => ds.data.map(p => p.y));
    const a = avg(all);
    card.querySelector('.spark-avg').textContent = a !== null ? 'avg ' + Math.round(a) + 'ms' : '';

    sparkCharts.push(new Chart(card.querySelector('canvas'), {
      type: 'line',
      data: { datasets },
      options: {
        responsive:true, maintainAspectRatio:false, animation:false,
        plugins:{ legend:{display:false}, tooltip:{enabled:false} },
        scales:{ x:{ type:'time', display:false }, y:{ display:false, beginAtZero:true } }
      }
    }));
  });
}

// ==================== TCP 流 ====================
function renderTcp() {
  const tbody = document.querySelector('#tcpTable tbody');
  const fSvc = document.getElementById('fService');
  const fIf  = document.getElementById('fIface').value;
  const fCl  = document.getElementById('fClient').value.trim();

  const svcs = [...new Set(tcpData.streams.map(s => s.service))].sort();
  const cur = fSvc.value;
  fSvc.innerHTML = '<option value="">全部服务</option>' + svcs.map(s => '<option' + (s===cur?' selected':'') + '>' + s + '</option>').join('');

  let synCount = 0;
  tcpData.streams.forEach(s => { if (s.state === 'SYN_SENT') synCount++; });
  document.getElementById('synCount').textContent = synCount;

  const rows = tcpData.streams.filter(s => {
    if (cur && s.service !== cur) return false;
    if (fIf && labelOf(s.iface) !== fIf) return false;
    if (fCl && !s.client.includes(fCl)) return false;
    return true;
  });
  tbody.innerHTML = rows.map(s =>
    '<tr class="' + (s.state === 'SYN_SENT' ? 'syn_sent' : '') + '">' +
    '<td>' + s.client + '</td><td>' + s.sport + '</td><td>' + s.dst + '</td><td>' + s.dport + '</td>' +
    '<td><span class="badge ' + badgeClassOf(s.iface) + '">' + labelOf(s.iface) + '</span></td>' +
    '<td>' + s.service + '</td><td>' + s.state + '</td></tr>'
  ).join('') || '<tr><td colspan="7" class="hint">暂无活跃 TCP 连接</td></tr>';

  document.getElementById('tcpTime').textContent = tcpData.ts ? '采集于 ' + fmtFull(tcpData.ts) : '';
}

// ==================== 数据加载 ====================
let histErr = 0;
async function loadHist() {
  try {
    const r = await fetch(HIST_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    histData = parseHistory(text);
    histErr = 0;
    document.getElementById('lastUpdate').textContent =
      '延迟更新 ' + new Date().toLocaleTimeString() + '（' + histData.length + ' 点）';
    renderOverview();
    ['wan1','wan2','v6'].forEach(k => {
      const st = chartState[k];
      if (!st) return;
      if (!st.isLive && st.sliderIdx > histData.length - 1) {
        st.sliderIdx = Math.max(0, histData.length - 1);
      }
      if (st.isLive) st.sliderIdx = Math.max(0, histData.length - 1);
      st.syncTimeline();
      drawChart(k);
      refreshToggleValues(k);
    });
    renderStats();
  } catch (e) {
    histErr++;
    if (histErr === 1) console.warn('history.log 加载失败:', e.message);
    document.getElementById('lastUpdate').textContent = '延迟数据加载失败（' + e.message + '）';
  }
}
async function loadTcp() {
  try {
    const r = await fetch(TCP_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    tcpData = await r.json();
    renderTcp();
  } catch (e) { console.warn('tcp.json 加载失败:', e.message); }
}

// ==================== 标签切换 ====================
function switchTab(name) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  // 切回的图表需要重算尺寸
  const map = { wan1:'wan1', wan2:'wan2', ipv6:'v6' };
  if (map[name] && charts[map[name]]) setTimeout(() => charts[map[name]].resize(), 0);
  if (name === 'overview') setTimeout(() => { charts.barChart?.resize(); sparkCharts.forEach(c => c.resize()); }, 0);
}
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});
['fService','fIface','fClient'].forEach(id => document.getElementById(id).addEventListener('input', renderTcp));

// ==================== 启动 ====================
// 必须先拿到 config.json 再建图：曲线名字、出口名都来自配置
(async function boot() {
  await loadConfig();

  smoothOn = loadSmooth();
  syncSmoothButtons();
  ['wan1','wan2','v6'].forEach(k => {
    document.getElementById('smoothBtn-' + k).addEventListener('click', () => setSmooth(!smoothOn));
  });
  initLineTab('wan1', 'chartWan1');
  initLineTab('wan2', 'chartWan2');
  initLineTab('v6', 'chartV6');
  loadStatWin();
  renderStats();
  loadHist();
  loadTcp();
  setInterval(loadHist, HIST_REFRESH);
  setInterval(loadTcp, TCP_REFRESH);
})();
</script>
