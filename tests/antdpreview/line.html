<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线路质量监测看板</title>
<link rel="stylesheet" href="lib/antd.dark.min.css">
<script src="lib/chart.umd.min.js"></script>
<script src="lib/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="lib/hammer.min.js"></script>
<script src="lib/chartjs-plugin-zoom.min.js"></script>
<style>
/* 页面底色与排版：antd 只管组件，不管 body 与栅格 */
html, body { background:#000; }
/* 让浏览器把原生控件（select 下拉、datalist、滚动条）也画成深色，
   否则展开后的 option 列表是白底浅字，基本看不清 */
html { color-scheme: dark; }
body {
  margin:0; font-size:14px; color:rgba(255,255,255,.85);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,
              'Noto Sans','PingFang SC','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;
}
.lm-page { max-width:1440px; margin:0 auto; padding:20px 24px 48px; }

/* 页头 */
.lm-head { display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:4px; }
.lm-head h1 { margin:0; font-size:20px; font-weight:600; line-height:1.4; color:rgba(255,255,255,.85); }
.lm-sub { margin-top:4px; font-size:13px; color:rgba(255,255,255,.45); }
.lm-head-right { margin-left:auto; display:flex; align-items:center; gap:12px; }
.lm-updated { font-size:12px; color:rgba(255,255,255,.45); white-space:nowrap; }

/* 标签页容器：antd 的 tabpane 显隐自己控制，不用它的动画 */
.lm-pane { display:none; }
.lm-pane.active { display:block; }

/* 栅格 */
.lm-grid { display:grid; gap:16px; margin-bottom:16px; }
.lm-cards { grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); }
.lm-sparks { grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }

/* antd 组件本地微调 */
.lm-page .ant-card { height:100%; }
.lm-page .ant-card-body { padding:16px; }
.lm-panel { margin-bottom:16px; }
.lm-detail { margin-top:8px; font-size:12px; color:rgba(255,255,255,.45); }
.lm-tabs-wrap { margin-bottom:16px; }

/* 迷你趋势卡 */
.lm-spark { cursor:pointer; transition:border-color .2s; }
.lm-spark:hover { border-color:#177ddc; }
.lm-spark-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
.lm-spark-title { font-size:13px; color:rgba(255,255,255,.85); }
.lm-spark-avg { font-size:12px; color:rgba(255,255,255,.45); font-variant-numeric:tabular-nums; }
.lm-spark-canvas { height:80px; position:relative; }

/* 曲线页工具条 */
.lm-toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }

/* 曲线开关 chip */
.lm-series { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px; }
.lm-series .ant-tag { margin:0; padding:3px 10px; cursor:pointer; user-select:none; transition:opacity .15s; }
.lm-series .ant-tag.lm-off { opacity:.35; }
.lm-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.lm-val { margin-left:6px; color:rgba(255,255,255,.45); font-variant-numeric:tabular-nums; }
.lm-series-actions { margin-left:auto; display:flex; gap:6px; }

/* 图表容器 */
.lm-chart { position:relative; height:340px; }
.lm-legend-note { margin-top:10px; font-size:12px; color:rgba(255,255,255,.45); }

/* 时间轴（参考 antd pro 分析页那张折线图底部的 dataZoom 滑块）：
   一条轨道 + 两个独立把手，拖动只改 x 轴窗口，不改数据。
   两个 input[type=range] 叠在同一位置，轨道设 pointer-events:none、只给 thumb 开
   pointer-events:auto，这样两个把手互不挡手。 */
.lm-timeaxis { position:relative; height:38px; margin:2px 10px 0; user-select:none; touch-action:none; }
.lm-ta-track { position:absolute; left:0; right:0; top:14px; height:4px; background:#303030; border-radius:2px; }
.lm-ta-sel { position:absolute; top:0; height:4px; background:#177ddc; border-radius:2px; }
.lm-ta-h {
  position:absolute; left:0; top:4px; width:100%; height:24px; margin:0;
  background:transparent; -webkit-appearance:none; appearance:none; pointer-events:none;
}
.lm-ta-h:focus { outline:none; }
.lm-ta-h::-webkit-slider-runnable-track { background:transparent; height:24px; }
.lm-ta-h::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none; pointer-events:auto;
  width:9px; height:24px; border-radius:3px; background:#177ddc;
  border:1px solid #0b3a63; cursor:col-resize;
  box-shadow:0 0 0 2px rgba(23,125,220,.16);
}
.lm-ta-h::-moz-range-track { background:transparent; height:24px; }
.lm-ta-h::-moz-range-thumb {
  pointer-events:auto; width:9px; height:24px; border-radius:3px; background:#177ddc;
  border:1px solid #0b3a63; cursor:col-resize;
}
.lm-ta-labels {
  position:absolute; left:0; right:0; bottom:0; display:flex;
  justify-content:space-between; font-size:11px; color:rgba(255,255,255,.45);
  font-variant-numeric:tabular-nums; pointer-events:none;
}
.lm-ta-reset { position:absolute; right:0; top:-16px; font-size:11px; color:#177ddc; cursor:pointer; }
.lm-ta-reset:hover { color:#3c9ae8; }

/* 表格：antd 默认单元格上下留 16px，监控表行数多，收紧一半；表格也要撑满内容区 */
.lm-page .ant-table table { width:100%; }
.lm-page .ant-table-thead > tr > th,
.lm-page .ant-table-tbody > tr > td { padding:9px 12px; }
.lm-page .ant-table-thead > tr > th { font-weight:500; }
.lm-page .ant-table-cell { word-break:break-word; }

/* 统计表 */
.lm-stat-note { margin-top:12px; font-size:12px; line-height:1.7; color:rgba(255,255,255,.45); }
.lm-num { text-align:right; font-variant-numeric:tabular-nums; }
.lm-num.lm-bad { color:#dc4446; }
.lm-num.lm-warn { color:#d89614; }
.lm-group { vertical-align:top; font-weight:500; white-space:nowrap; }
.lm-row-syn > td { background:rgba(220,68,70,.14) !important; }

/* 过滤器 */
.lm-filters { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.lm-filters select, .lm-filters input {
  height:32px; padding:4px 11px; font-size:14px; border-radius:2px;
  background:#141414; color:rgba(255,255,255,.85);
  border:1px solid #434343; outline:none; transition:border-color .2s, box-shadow .2s;
}
.lm-filters select:focus, .lm-filters input:focus {
  border-color:#177ddc; box-shadow:0 0 0 2px rgba(23,125,220,.2);
}
.lm-filters input::placeholder { color:rgba(255,255,255,.3); }
.lm-hint { font-size:13px; color:rgba(255,255,255,.45); }
.lm-hint .lm-syn { color:#dc4446; font-weight:600; }

/* 空态 */
.lm-empty { padding:28px; text-align:center; color:rgba(255,255,255,.45); }
</style>
</head>
<body>
<div class="lm-page">

  <div class="lm-head">
    <div>
      <h1 id="dashTitle">线路质量监测看板</h1>
      <div class="lm-sub" id="dashSub"></div>
    </div>
    <div class="lm-head-right">
      <span class="lm-updated" id="lastUpdate"></span>
      <a class="ant-btn ant-btn-default ant-btn-sm" href="config.html"><span>⚙ 设置</span></a>
    </div>
  </div>

  <div class="lm-tabs-wrap ant-tabs ant-tabs-top" id="mainTabs">
    <div class="ant-tabs-nav">
      <div class="ant-tabs-nav-wrap">
        <div class="ant-tabs-nav-list" id="tabNav"></div>
      </div>
    </div>
  </div>

  <div class="lm-pane active" id="tab-overview">
    <div class="lm-grid lm-cards" id="overviewCards"></div>
    <div class="lm-grid lm-sparks" id="sparkGrid"></div>
    <div class="ant-card lm-panel">
      <div class="ant-card-head">
        <div class="ant-card-head-wrapper">
          <div class="ant-card-head-title">各目标延迟对比（最新一次采集，ms）</div>
        </div>
      </div>
      <div class="ant-card-body">
        <div class="lm-chart" style="height:380px"><canvas id="barChart"></canvas></div>
        <div class="lm-legend-note">ICMP 类目标若 100% 丢包为「DNS(ICMP)受限」，非线路故障</div>
      </div>
    </div>
    <div id="statBox-overview"></div>
  </div>

  <div id="exitPanes"></div>

  <div class="lm-pane" id="tab-tcp">
    <div class="ant-card lm-panel">
      <div class="ant-card-body">
        <div class="lm-filters">
          <select id="fService" aria-label="按服务过滤"><option value="">全部服务</option></select>
          <select id="fIface" aria-label="按出口过滤"><option value="">全部出口</option></select>
          <input id="fClient" aria-label="按设备IP过滤" placeholder="设备IP过滤，如 192.168.66.24">
          <span class="lm-hint">SYN_SENT（卡住的连接）<span class="lm-syn" id="synCount">0</span> 个</span>
          <span class="lm-hint" id="tcpTime" style="margin-left:auto"></span>
        </div>
        <div class="ant-table">
          <div class="ant-table-container">
            <div class="ant-table-content">
              <table>
                <thead class="ant-table-thead">
                  <tr>
                    <th class="ant-table-cell">设备IP</th>
                    <th class="ant-table-cell">源端口</th>
                    <th class="ant-table-cell">目标IP</th>
                    <th class="ant-table-cell">目标端口</th>
                    <th class="ant-table-cell">出口</th>
                    <th class="ant-table-cell">服务</th>
                    <th class="ant-table-cell">状态</th>
                  </tr>
                </thead>
                <tbody class="ant-table-tbody" id="tcpBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
// ==================== 配置 ====================
const HIST_URL = 'history.log';
const TCP_URL  = 'tcp.json';
const CONFIG_URL = 'config.json';
const HIST_REFRESH = 15000;   // 有条件请求兜着，实际只在有新采集点时才重传
const TCP_REFRESH  = 5000;
const CONF_REFRESH = 30000;
let histTimer = 0, tcpTimer = 0, confTimer = 0, confSig = '';
const LS_KEY = 'lm_visibility';
const LS_KEY_SMOOTH = 'lm_smooth';
const LS_KEY_STATWIN = 'lm_statwin';

// 内置默认值：读不到 config.json 时退回这套，保证看板永远能开
const DEFAULT_EXITS = [
  { if:'eth1',        label:'移动', type:'both' },
  { if:'pppoe-wan2',  label:'电信', type:'both' }
];
const DEFAULT_V4_TARGETS = ['阿里DNS','腾讯DNS','CNNIC','微信','淘宝','B站','字节','QQ'];
const DEFAULT_V6_TARGETS = ['阿里v6','腾讯v6','移动v6'];

let V4_TARGETS = DEFAULT_V4_TARGETS.slice();
let V6_TARGETS = DEFAULT_V6_TARGETS.slice();
let EXITS = DEFAULT_EXITS.slice();

// 出口类型（targets.conf 出口行的第 5 个字段）：
//   v4   只测/只画 IPv4 目标
//   v6   只测/只画 IPv6 目标
//   both 两组都来（缺省）
// 看板按出口分标签页，类型决定那一页里有哪些曲线。老配置没这字段，一律按 both 算。
function exitType(e) { return (e && (e.type === 'v4' || e.type === 'v6')) ? e.type : 'both'; }
const wantsV4 = e => exitType(e) !== 'v6';
const wantsV6 = e => exitType(e) !== 'v4';

// 标签页键：出口页统一用 'ex:<接口名>'。DOM id 会拼成 'tab-ex:eth1' 这种带冒号的
// 形式，一律用 getElementById 取 —— 冒号在 CSS 选择器里是伪类，不能直接写。
const tabKeyOf = iface => 'ex:' + iface;

// 曲线区块：一个出口页里 IPv4 / IPv6 各占一块。
// 区块键在标签页键后面接 '~v4' / '~v6'，DOM id 拼成 'chart-ex:eth1~v4'。
// 冒号和波浪号都在 getElementById 里正常，只是不能写进 CSS 选择器。
const blockKeyOf = (iface, fam) => tabKeyOf(iface) + '~' + fam;
function blocksOf(iface) {
  const ex = EXITS.find(e => e.if === iface);
  if (!ex) return [];
  const out = [];
  if (wantsV4(ex)) out.push({ key: blockKeyOf(iface, 'v4'), fam: 'v4', iface, tab: tabKeyOf(iface), title: labelOf(iface) + ' · IPv4' });
  if (wantsV6(ex)) out.push({ key: blockKeyOf(iface, 'v6'), fam: 'v6', iface, tab: tabKeyOf(iface), title: labelOf(iface) + ' · IPv6' });
  return out;
}
const allBlocks = () => EXITS.flatMap(e => blocksOf(e.if));
function blockByKey(key) { return allBlocks().find(b => b.key === key) || null; }
function blocksOfTab(tabKey) { return allBlocks().filter(b => b.tab === tabKey); }
// 该区块画哪几个目标：v4 取 V4_TARGETS，key 是 '<接口>|<目标>'；
// v6 取 V6_TARGETS，key 是 'v6-<接口>|<目标>'。
function blockTargets(b) { return b.fam === 'v4' ? V4_TARGETS : V6_TARGETS; }
function blockKeyPrefix(b) { return b.fam === 'v6' ? 'v6-' : ''; }

// 统计表配色阈值（毫秒），由 config.json 覆盖。只有前端用，不影响采集。
// 「最大延迟」看有没有偶发卡死，「波动σ」看这条线路稳不稳，各目标基线差异大所以要可调。
let TH_MAX_WARN = 300, TH_MAX_BAD = 1000;
let TH_SD_WARN = 50, TH_SD_BAD = 200;
let LAN_NETS = '';   // config.json 里的实际生效网段，只用来写 TCP 页的过滤提示

// Ant Design 深色主题的语义色（success/warning/error/primary），曲线配色也照它的色板走
const C_PRIMARY = '#177ddc', C_SUCCESS = '#49aa19', C_WARNING = '#d89614', C_ERROR = '#dc4446';
const C_TEXT = 'rgba(255,255,255,.85)', C_TEXT_2 = 'rgba(255,255,255,.45)';
const C_GRID = '#303030', C_PANEL = '#1f1f1f';

const PALETTE = ['#177ddc','#49aa19','#d89614','#db2fb9','#642ab5','#13c2c2','#fa8c16','#8c8c8c','#dc4446','#2f9bd6','#a0d911'];
// 总览柱状图的出口配色，按出口顺序取，出口多了也不会撞
const BAR_COLORS = ['rgba(23,125,220,.8)','rgba(73,170,25,.8)','rgba(216,150,20,.8)','rgba(219,47,185,.8)','rgba(19,194,194,.8)','rgba(250,140,22,.8)'];

// 接口名 -> 看板显示名（未知接口原样返回）
function labelOf(iface) {
  if (!iface) return '';
  const hit = EXITS.find(e => e.if === iface);
  if (hit) return hit.label;
  if (iface === '未知') return '未知';
  return iface;
}
// 出口 -> antd Tag 配色。按出口序号取色，用户改成什么名字都有对应样式。
const TAG_COLORS = ['ant-tag-blue','ant-tag-green','ant-tag-gold','ant-tag-purple','ant-tag-cyan','ant-tag-magenta'];
function tagClassOf(iface) {
  const i = EXITS.findIndex(e => e.if === iface);
  return i >= 0 ? TAG_COLORS[i % TAG_COLORS.length] : '';
}

// 拉取 /www/lm/config.json（由 lm_config_json.sh 从 targets.conf 生成）
async function loadConfig() {
  try {
    const r = await fetch(CONFIG_URL, { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const cfg = await r.json();
    if (cfg.title) document.getElementById('dashTitle').textContent = cfg.title;
    document.title = (cfg.title || '线路质量监测看板');
    if (cfg.subtitle) document.getElementById('dashSub').textContent = cfg.subtitle;
    if (Array.isArray(cfg.exits) && cfg.exits.length) EXITS = cfg.exits;
    if (Array.isArray(cfg.targets_v4) && cfg.targets_v4.length) V4_TARGETS = cfg.targets_v4;
    if (Array.isArray(cfg.targets_v6) && cfg.targets_v6.length) V6_TARGETS = cfg.targets_v6;
    if (typeof cfg.lan_nets === 'string' && cfg.lan_nets) LAN_NETS = cfg.lan_nets;
    const pos = (v, d) => (typeof v === 'number' && isFinite(v) && v > 0 ? v : d);
    TH_MAX_WARN = pos(cfg.th_max_warn, TH_MAX_WARN);
    TH_MAX_BAD  = pos(cfg.th_max_bad,  TH_MAX_BAD);
    TH_SD_WARN  = pos(cfg.th_sd_warn,  TH_SD_WARN);
    TH_SD_BAD   = pos(cfg.th_sd_bad,   TH_SD_BAD);
  } catch (e) {
    console.warn('config.json 读取失败，用内置默认值:', e.message);
  }
  buildTabs();
  applyConfigToDom();
}

// 按出口列表生成标签页（导航 + 内容区）。总览在最前，实时TCP流在最后。
// 出口数变化时整块重建，图表和可见性状态会跟着重建。
//
// 出口页里 IPv4 与 IPv6 各占一张卡（各有自己的曲线、开关、时间轴、统计表）。
// 之前两组曲线画在同一张图上，v6 只能靠虚线区分，十几条线叠在一起根本看不清。
function buildTabs() {
  const nav = document.getElementById('tabNav');
  const panes = document.getElementById('exitPanes');
  if (!nav || !panes) return;

  // 重建前记下当前页：配置轮询（checkConfig）也会走到这里，
  // 不记住的话每次重建都会把用户甩回「总览」，而且所有 pane 都不带 active 变成空白。
  const cur = currentTab
    || (document.querySelector('#tabNav .ant-tabs-tab-active') || {}).dataset?.tab
    || 'overview';

  nav.innerHTML = '';
  panes.innerHTML = '';

  const mkTab = (key, text, active) => {
    const d = document.createElement('div');
    d.className = 'ant-tabs-tab' + (active ? ' ant-tabs-tab-active' : '');
    d.dataset.tab = key;
    d.innerHTML = '<div class="ant-tabs-tab-btn" role="tab" aria-selected="' + (active ? 'true' : 'false') + '">' + text + '</div>';
    d.addEventListener('click', () => switchTab(d.dataset.tab));
    return d;
  };

  nav.appendChild(mkTab('overview', '总览', cur === 'overview'));

  EXITS.forEach(e => {
    const key = tabKeyOf(e.if);
    nav.appendChild(mkTab(key, e.label, key === cur));

    const blocks = blocksOf(e.if);
    let html = '';
    blocks.forEach(b => {
      html +=
        '<div class="ant-card lm-panel">'
        + '<div class="ant-card-head"><div class="ant-card-head-wrapper">'
        +   '<div class="ant-card-head-title">' + b.title + '</div>'
        +   '<div class="ant-card-extra"><div class="lm-toolbar" style="margin:0">'
        +     '<button id="liveBtn-' + b.key + '" class="ant-btn ant-btn-sm ant-btn-primary" title="回到最新数据"><span>● 实时</span></button>'
        +     '<button id="smoothBtn-' + b.key + '" class="ant-btn ant-btn-sm" aria-pressed="false"'
        +       ' title="平滑曲线：单调插值，不会超出相邻数据点"><span>〰 平滑</span></button>'
        +   '</div></div>'
        + '</div></div>'
        + '<div class="ant-card-body">'
        +   '<div class="lm-series" id="toggles-' + b.key + '"></div>'
        +   '<div class="lm-chart"><canvas id="chart-' + b.key + '"></canvas></div>'
        +   '<div id="axis-' + b.key + '"></div>'
        + '</div></div>'
        + '<div id="statBox-' + b.key + '"></div>';
    });

    const pane = document.createElement('div');
    pane.className = 'lm-pane' + (key === cur ? ' active' : '');
    pane.id = 'tab-' + key;
    pane.innerHTML = html;
    panes.appendChild(pane);
  });

  nav.appendChild(mkTab('tcp', '实时TCP流', cur === 'tcp'));

  // 出口数变了，旧的图表实例和状态要清掉（canvas 已经不在 DOM 里了）
  Object.keys(charts).forEach(k => { if (k !== 'barChart') { try { charts[k].destroy(); } catch (e) {} delete charts[k]; } });
  Object.keys(chartState).forEach(k => delete chartState[k]);
  Object.keys(taState).forEach(k => delete taState[k]);

  // 新 canvas 建好，接着就把曲线图和事件挂上。配置变化时也会走到这里，
  // 所以重建之后必须重新 initLineTab，否则页面会剩下一堆空白图。
  allBlocks().forEach(b => {
    initLineTab(b.key, 'chart-' + b.key);
    const sb = document.getElementById('smoothBtn-' + b.key);
    if (sb) sb.addEventListener('click', () => setSmooth(!smoothOn));
  });

  // 总览 / TCP 两页是静态 HTML，不参与上面的重建，active 得手动跟一次
  const ov = document.getElementById('tab-overview');
  if (ov) ov.classList.toggle('active', cur === 'overview');
  const tc = document.getElementById('tab-tcp');
  if (tc) tc.classList.toggle('active', cur === 'tcp');

  // 统计表容器是刚建出来的空 div，得重画一次。首次 boot 时 histData 还是空的，
  // 画出来是 0 行，之后 loadHist 会再画一次。
  renderStats();
}

// 把配置写进静态 DOM（副标题、出口下拉）
function applyConfigToDom() {
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };

  if (!document.getElementById('dashSub').textContent) {

  }

  const keep = sel.value;
  sel.innerHTML = '<option value="">全部出口</option>' +
    EXITS.map(e => '<option>' + e.label + '</option>').join('') +
    '<option>未知</option>';
  sel.value = keep;

  // TCP 页的过滤提示：把实际内网网段写进 placeholder。
  // 配置里留空时后端会自动识别，所以这里拿到的总是当前真正生效的网段。
  const fc = document.getElementById('fClient');
  if (fc) {
    const first = (LAN_NETS || '').split(/\s+/)[0];
    const net = first.split('/')[0];
    if (/^\d+\.\d+\.\d+\.\d+$/.test(net)) {
      fc.placeholder = '设备IP过滤，如 ' + net.replace(/\.\d+$/, '.') + '24';
    }
  }
}


// ==================== 状态 ====================
let histData = [];
let tcpData = { ts:0, streams:[] };
let charts = {};
const chartState = {};   // blockKey -> { defs, visible:Set, sliderIdx, isLive }
let smoothOn = false;    // 平滑曲线开关（全局，所有曲线区块共用）

// 时间轴（每张图下面那条双把手滑块，参考 antd pro 分析页的 dataZoom）：
// taState[blockKey] = { lo, hi }，值是 0~1000 的千分比位置，不是时间。
// 用百分比而不是时间戳，是为了让把手位置跟数据范围解耦——新采集点进来时
// 只要没人拖过把手，窗口就自动跟着数据走。
const taState = {};
// 全局时间窗口（毫秒时间戳）。null = 跟着数据自动（等于「全部」）。
// 它就是 x 轴的唯一真相：统计表的窗口、每张图的 x.min/max 都从这里取。
let xRange = null;
// true 表示窗口是用户拖时间轴拖出来的（此时统计窗口的分段按钮全部不选中）
let xRangeCustom = false;
// 当前标签页键。buildTabs() 重建时要靠它把用户留在原页，否则配置轮询每次
// 触发重建都会把人甩回「总览」。
let currentTab = 'overview';

// ==================== 工具 ====================
function pad(n) { return String(n).padStart(2,'0'); }
function fmtTime(ts) { const d = new Date(ts*1000); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function fmtFull(ts) {
  const d = new Date(ts*1000);
  return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+fmtTime(ts)+':'+pad(d.getSeconds());
}
function avg(a) { return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null; }
function lastValue(key) {
  for (let i = histData.length-1; i >= 0; i--) {
    const s = histData[i].series[key];
    if (s && s.value !== null) return s.value;
  }
  return null;
}
function valAt(key, idx) {
  // 取 <= idx 的最近一个有效值（用于开关 chip 显示当前时刻的值）
  for (let i = Math.min(idx, histData.length-1); i >= 0; i--) {
    const s = histData[i].series[key];
    if (s && s.value !== null) return s.value;
  }
  return null;
}

// ==================== 解析 history.log ====================
function parseHistory(text) {
  const out = [];
  for (const line of text.split('\n')) {
    const t = line.trim();
    if (!t) continue;
    const parts = t.split(/\s+/);
    const ts = Number(parts[0]);
    if (!ts) continue;
    const series = {};
    for (let i = 1; i < parts.length; i++) {
      const m = parts[i].match(/^([^|]+)\|([^=]+)=([^,]+),(.+)$/);
      if (!m) continue;
      const rawVal = m[3], rawLoss = m[4];
      // 旧版采集脚本在 curl rc=52/56 时会写出 "0,1"：0 不是真延迟，是没测到。
      // 采集侧已修（值 <=0 一律记 FAIL），这里兜住已经落盘的历史行。
      const fail = (rawVal === 'FAIL') || (Number(rawVal) === 0 && rawLoss === '1');
      series[m[1] + '|' + m[2]] = {
        value: fail ? null : Number(rawVal),
        loss: fail ? 100 : (rawLoss === undefined ? 0 : Number(rawLoss)),
        status: rawLoss
      };
    }
    out.push({ ts, series });
  }
  return out;
}

// ==================== 失败红点 plugin ====================
// 用时间戳定位像素坐标，避免数据断点导致索引错位
const failDotPlugin = {
  id: 'failDots',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    const xs = chart.scales.x, ys = chart.scales.y;
    chart.data.datasets.forEach((ds, di) => {
      if (!ds._fails || !ds._fails.length) return;
      if (!chart.isDatasetVisible(di)) return;
      ctx.save();
      ds._fails.forEach(f => {
        const px = xs.getPixelForValue(f.x);
        const py = ys.getPixelForValue(f.y);
        if (!isFinite(px) || !isFinite(py)) return;
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI*2);
        ctx.fillStyle = C_ERROR;
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });
      ctx.restore();
    });
  }
};
Chart.register(failDotPlugin);

// ==================== 数据集构建 ====================
// endIdx: null/undefined = 全部数据（实时）；数字 = 只画到该索引（回放）
//
// 断线语义（见 README 踩坑 33）：
//   完全不可达（history.log 里是 FAIL）→ 该时间戳压入 {y:null}，靠 spanGaps:false 断开。
//     不能直接跳过这个点——跳过后数组里只剩成功的点，x 间隔变大但相邻两点仍然相连，
//     Chart.js 会照常画一条平滑曲线跨过整段断网，这正是之前「断网处平滑连到下一个点」的原因。
//   部分丢包（有丢包但不是全丢）→ 值仍然有效，但这一段的线用虚线画，表示「这次数据不可信」。
//     v4 用 [5,4]，v6 本身整条是虚线，改用更密的 [2,3] 不混淆。
//     阈值不能取「>0」：ICMP 目标记的是丢包百分比（三包丢一包 = 33），
//     HTTP 目标记的是丢包率小数（0.3 表示 0.3%），按 >0 判会把 HTTP 的正常抖动
//     全画成虚线（真机实测微信 1009 个点里有 531 个被误判）。取 10 才能把两者分开。
const LOSSY_MIN_PCT = 10;
function segLossPct(p) {
  return (p && typeof p.loss === 'number') ? p.loss : 0;
}
function isLossy(p) {
  const l = segLossPct(p);
  return l >= LOSSY_MIN_PCT && l < 100;
}

function buildDatasets(defs, endIdx) {
  const sliceAll = (endIdx === null || endIdx === undefined);
  const slice = sliceAll ? histData : histData.slice(0, endIdx + 1);
  return defs.map(def => {
    const points = [];
    const fails = [];
    let lastY = null;
    let inFail = false;
    slice.forEach(d => {
      const s = d.series[def.key];
      if (!s) return;
      if (s.value !== null) {
        points.push({ x: d.ts * 1000, y: s.value, loss: s.loss });
        lastY = s.value;
        inFail = false;
      } else {
        // 断网点：必须占位，否则曲线会跨过去
        points.push({ x: d.ts * 1000, y: null, loss: 100 });
        if (!inFail) {
          // 连续丢包只在段起点标一个红点；y 取最近有效值，从未成功过则落底
          fails.push({ x: d.ts * 1000, y: lastY !== null ? lastY : 0 });
          inFail = true;
        }
      }
    });
    return {
      label: def.label,
      data: points,
      borderColor: def.color,
      backgroundColor: def.color,
      borderWidth: 1.6,
      borderDash: def.dash || [],
      pointRadius: 0,
      pointHoverRadius: 4,
      pointHitRadius: 10,
      tension: smoothOn ? 0.4 : 0,
      cubicInterpolationMode: smoothOn ? 'monotone' : 'default',
      spanGaps: false,
      // 有丢包的段改成虚线（Chart.js 4 的 segment 回调按段生效，优先级高于顶层 borderDash）
      segment: {
        borderDash: ctx => {
          const a = ctx.p0 && ctx.p0.raw, b = ctx.p1 && ctx.p1.raw;
          if (ctx.p0 && ctx.p0.skip) return undefined;
          if (ctx.p1 && ctx.p1.skip) return undefined;
          if (isLossy(a) || isLossy(b)) return def.dash ? [2, 3] : [5, 4];
          return def.dash || [];
        }
      },
      _color: def.color,
      _fails: fails
    };
  });
}

// ==================== 缩放边界 ====================
// 缩放/平移不许越过实际数据范围：右边界最多到最新一个采集点，左边界最多到最早一个点，
// 拖不出空白区域。
//
// 为什么不用插件自带的 limits：'original' 会把范围锁死在页面加载那一刻，之后新采集的
// 点会被挤出画面（实测数据涨到 04:02 而轴停在 03:52）；'data' 这个关键字 2.0.1 不认。
// 所以在每次缩放/平移结束后自己夹一次。
let clampingX = false;
function clampXToData(chart) {
  if (clampingX || !chart) return;
  const all = chart.data.datasets.flatMap(d => d.data.map(p => p.x));
  if (all.length < 2) return;
  const dMin = Math.min(...all), dMax = Math.max(...all);
  const xs = chart.scales.x;
  if (xs.min >= dMin && xs.max <= dMax) return;   // 已经在范围内，不用动
  let a = Math.max(xs.min, dMin);
  let b = Math.min(xs.max, dMax);
  if (b - a < 60000) { a = dMin; b = dMax; }      // 夹得比一分钟还窄就直接还原全范围
  clampingX = true;
  chart.zoomScale('x', { min: a, max: b }, 'none');
  setTimeout(() => { clampingX = false; }, 0);
}

// 滚轮缩放/平移之后，把手和统计窗口要跟上：此时窗口由用户的手势决定，
// 所以回写全局 xRange 并标成自定义（分段按钮随之全部取消选中）。
function syncRangeFromChart(chart) {
  if (!chart || !chart.scales || !chart.scales.x) return;
  const xs = chart.scales.x;
  const span = dataSpanMs();
  if (!span) return;
  if (xs.min <= span.min + 1000 && xs.max >= span.max - 1000) {
    xRange = null; xRangeCustom = false;
  } else {
    xRange = { min: xs.min, max: xs.max };
    xRangeCustom = true;
  }
  Object.keys(chartState).forEach(k => refreshToggleValues(k));
  renderStats();
  syncTimeAxisAll();
}

// ==================== 折线图通用配置 ====================
function lineOptions() {
  return {

    maintainAspectRatio: false,

    interaction: { mode: 'nearest', axis: 'x', intersect: false },

// ==================== 图表定义（每个区块的曲线来源）====================
// 一个区块只画一个地址族，所以 v4 区块里全是实线、v6 区块里全是虚线，
// 颜色各自从色板头部开始排（两组不再需要错开，因为已经分到两张图里了）。
function blockDefs(blockKey) {
  const b = blockByKey(blockKey);
  if (!b) return [];
  const pfx = blockKeyPrefix(b);
  return blockTargets(b).map((t, i) => ({
    label: t,
    key: pfx + b.iface + '|' + t,
    color: PALETTE[i % PALETTE.length],
    dash: b.fam === 'v6' ? [5, 4] : undefined
  }));
}

// ==================== 可见性持久化 ====================
function loadVis() { try { return JSON.parse(localStorage.getItem(LS_KEY) || '{}'); } catch (e) { return {}; } }
function saveVis() {
  const o = {};
  for (const k in chartState) o[k] = [...chartState[k].visible];
  try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch (e) {}

// ==================== 曲线开关 ====================
function renderToggles(tabKey) {
  const st = chartState[tabKey];
  const box = document.getElementById('toggles-' + tabKey);
  box.innerHTML = '';
  st.valEls = {};

  st.defs.forEach(def => {
    const chip = document.createElement('span');
    const shown = st.visible.has(def.label);
    chip.className = 'ant-tag ' + (shown ? '' : 'lm-off');
    const dot = document.createElement('span');
    dot.className = 'lm-dot';
    dot.style.background = def.color;
    const name = document.createElement('span');
    name.textContent = def.label;
    const val = document.createElement('span');
    val.className = 'lm-val';
    chip.append(dot, name, val);
    chip.title = '点击显示/隐藏该曲线';
    st.valEls[def.label] = val;
    chip.addEventListener('click', () => {
      if (st.visible.has(def.label)) st.visible.delete(def.label);
      else st.visible.add(def.label);
      applyVisibility(tabKey);
      renderToggles(tabKey);
      saveVis();
    });
    box.appendChild(chip);
  });

  // 全开 / 全关
  const actions = document.createElement('span');
  actions.className = 'lm-series-actions';
  const btnAll = document.createElement('button');
  btnAll.className = 'ant-btn ant-btn-sm';
  btnAll.innerHTML = '<span>全选</span>';
  btnAll.addEventListener('click', () => {
    st.defs.forEach(d => st.visible.add(d.label));
    applyVisibility(tabKey); renderToggles(tabKey); saveVis();
  });
  const btnNone = document.createElement('button');
  btnNone.className = 'ant-btn ant-btn-sm';
  btnNone.innerHTML = '<span>全不选</span>';
  btnNone.addEventListener('click', () => {
    st.visible.clear();
    applyVisibility(tabKey); renderToggles(tabKey); saveVis();
  });
  actions.append(btnAll, btnNone);
  box.appendChild(actions);

  refreshToggleValues(tabKey);
}

// 只刷新开关上的数值文本，不重建 DOM（避免打断悬停/点击）
function refreshToggleValues(tabKey) {
  const st = chartState[tabKey];
  if (!st || !st.valEls) return;
  const curIdx = st.isLive ? histData.length - 1 : st.sliderIdx;
  st.defs.forEach(def => {
    const el = st.valEls[def.label];
    if (!el) return;
    const v = valAt(def.key, curIdx);
    el.textContent = v === null ? '—' : Math.round(v) + 'ms';
  });
}

function applyVisibility(tabKey) {
  const st = chartState[tabKey];
  const chart = charts[tabKey];
  if (!chart) return;
  chart.data.datasets.forEach((ds, i) => {
    chart.setDatasetVisibility(i, st.visible.has(ds.label));
  });
  chart.update('none');
}

// ==================== 绘制 / 刷新 ====================
function drawChart(tabKey) {
  const st = chartState[tabKey];
  const endIdx = st.isLive ? null : st.sliderIdx;
  const datasets = buildDatasets(st.defs, endIdx);
  const chart = charts[tabKey];
  chart.data.datasets = datasets;
  datasets.forEach((ds, i) => chart.setDatasetVisibility(i, st.visible.has(ds.label)));
  chart.update('none');
}

// ==================== 平滑开关 ====================
// 开启后用单调三次插值画曲线：视觉圆滑，但曲线永远不会越过相邻数据点的值，
// 既不会把尖刺画得比真实更高，也不会在低点之间画到负数。
// 关掉就是折线，尖刺的陡峭程度看得最准。红点（失败标记）两种模式都不受影响。
function loadSmooth() {
  try { return localStorage.getItem(LS_KEY_SMOOTH) === '1'; } catch (e) { return false; }
}
function syncSmoothButtons() {
  Object.keys(chartState).forEach(k => {
    const btn = document.getElementById('smoothBtn-' + k);
    if (btn) {
      btn.classList.toggle('ant-btn-primary', smoothOn);
      btn.setAttribute('aria-pressed', smoothOn ? 'true' : 'false');
    }
  });
}
function applySmooth() {
  syncSmoothButtons();
  Object.keys(chartState).forEach(k => { if (charts[k]) drawChart(k); });
  renderSparks();
}
function setSmooth(on) {
  smoothOn = on;
  try { localStorage.setItem(LS_KEY_SMOOTH, on ? '1' : '0'); } catch (e) {}
  applySmooth();
}

// ==================== 实时状态 ====================
function setupTimeline(tabKey) {
  const st = chartState[tabKey];
  const liveBtn = document.getElementById('liveBtn-' + tabKey);

  // 没有时间显示控件了，保留空实现给 loadHist 等调用点
  st.syncTimeline = function () {};

  function setLive(on) {
    st.isLive = on;
    liveBtn.classList.toggle('ant-btn-primary', on);
    if (on) st.sliderIdx = Math.max(0, histData.length - 1);
    st.syncTimeline();
    drawChart(tabKey);
    refreshToggleValues(tabKey);
  }
  st.setLive = setLive;

  liveBtn.addEventListener('click', () => setLive(true));
}

// ==================== 时间轴滑块 ====================
// 参考 antd pro 分析页那张折线图底部的 dataZoom：一条轨道 + 两个把手。
// 拖动改的是全局 xRange（所有区块的图与统计表同步），双击图表则还原。
const TA_PCT = 1000;          // 把手位置精度：千分之一
function dataSpanMs() {
  if (histData.length < 2) return null;
  const a = histData[0].ts * 1000, b = histData[histData.length-1].ts * 1000;
  return b > a ? { min: a, max: b } : null;
}

// 当前窗口换算成 0~1000 的位置；没设窗口就是整条轨道
function taPosFromRange() {
  const span = dataSpanMs();
  if (!span || !xRange) return { lo: 0, hi: TA_PCT };
  const w = span.max - span.min;
  const lo = Math.max(0, Math.min(TA_PCT, Math.round((xRange.min - span.min) / w * TA_PCT)));
  const hi = Math.max(0, Math.min(TA_PCT, Math.round((xRange.max - span.min) / w * TA_PCT)));
  return { lo: Math.min(lo, hi - 5), hi: Math.max(hi, lo + 5) };
}

function renderTimeAxis(blockKey) {
  const box = document.getElementById('axis-' + blockKey);
  if (!box) return;
  const p = taPosFromRange();
  taState[blockKey] = p;
  const span = dataSpanMs();

  box.className = 'lm-timeaxis';
  box.innerHTML =
    '<div class="lm-ta-track"><div class="lm-ta-sel" style="left:' + (p.lo / TA_PCT * 100) + '%;'
      + 'width:' + ((p.hi - p.lo) / TA_PCT * 100) + '%"></div></div>'
    + '<input type="range" class="lm-ta-h" data-h="0" min="0" max="' + TA_PCT + '" value="' + p.lo + '"'
      + ' step="1" aria-label="时间窗口起点">'
    + '<input type="range" class="lm-ta-h" data-h="1" min="0" max="' + TA_PCT + '" value="' + p.hi + '"'
      + ' step="1" aria-label="时间窗口终点">'
    + '<div class="lm-ta-labels"><span>' + (span ? fmtFull(span.min / 1000) : '') + '</span>'
      + '<span>' + (span ? fmtFull(span.max / 1000) : '') + '</span></div>';

  if (span) {
    const rs = document.createElement('span');
    rs.className = 'lm-ta-reset';
    rs.textContent = '重置窗口';
    rs.addEventListener('click', () => { xRange = null; xRangeCustom = false; applyXRange(); });
    box.appendChild(rs);
  }

  box.querySelectorAll('.lm-ta-h').forEach(inp => {
    inp.addEventListener('input', () => onTaDrag(blockKey, Number(inp.dataset.h), Number(inp.value)));
  });
}

function onTaDrag(blockKey, which, val) {
  const span = dataSpanMs();
  if (!span) return;
  const p = taState[blockKey] || { lo: 0, hi: TA_PCT };
  if (which === 0) p.lo = Math.min(val, p.hi - 5);
  else             p.hi = Math.max(val, p.lo + 5);
  taState[blockKey] = p;

  const w = span.max - span.min;
  xRange = { min: span.min + w * p.lo / TA_PCT, max: span.min + w * p.hi / TA_PCT };
  // 拖到贴住两端就等于「全部」，此时不算自定义
  xRangeCustom = !(p.lo === 0 && p.hi === TA_PCT);
  applyXRange();
}

// 把 xRange 推到所有图和统计表上，并同步每张图下面的把手位置
function applyXRange() {
  Object.keys(charts).forEach(k => {
    if (k === 'barChart') return;
    const c = charts[k];
    if (!c) return;
    c.options.scales.x.min = xRange ? xRange.min : undefined;
    c.options.scales.x.max = xRange ? xRange.max : undefined;
    c.update('none');
  });
  Object.keys(chartState).forEach(k => refreshToggleValues(k));

function initLineTab(blockKey, canvasId) {
  const defs = blockDefs(blockKey);
  const saved = loadVis()[blockKey];
  const visible = new Set();
  defs.forEach(d => {
    if (saved && saved.length) { if (saved.includes(d.label)) visible.add(d.label); }
    else visible.add(d.label);
  });
  chartState[blockKey] = { defs, visible, sliderIdx: 0, isLive: true };

  charts[blockKey] = new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { datasets: buildDatasets(defs, null) },
    options: lineOptions()
  });
  const cv = document.getElementById(canvasId);
  // 移动端双指缩放需要触摸事件
  cv.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // 双击图表 = 还原窗口（跟拖时间轴到两端等价）
  cv.addEventListener('dblclick', () => {
    if (xRange) { xRange = null; xRangeCustom = false; applyXRange(); }
    else charts[blockKey]?.resetZoom();
  });

  applyVisibility(blockKey);
  setupTimeline(blockKey);
  renderToggles(blockKey);
  renderTimeAxis(blockKey);
}

// ==================== 统计 ====================
const STAT_WINDOWS = [
  { k:'1h',  label:'1 小时',  sec:3600 },
  { k:'6h',  label:'6 小时',  sec:21600 },
  { k:'24h', label:'24 小时', sec:86400 },
  { k:'all', label:'全部',    sec:null }
];
let statWin = '1h';

function loadStatWin() {
  try {
    const v = localStorage.getItem(LS_KEY_STATWIN);
    if (STAT_WINDOWS.some(w => w.k === v)) statWin = v;
  } catch (e) {}
}
function syncStatWinButtons() {
  document.querySelectorAll('.lm-pane .ant-segmented-item[data-w]').forEach(el => {
    // 窗口是拖时间轴拖出来的（xRangeCustom）就没有任何预设按钮该亮
    const on = !xRangeCustom && el.dataset.w === statWin;
    el.classList.toggle('ant-segmented-item-selected', on);
    const input = el.querySelector('input');
    if (input) input.checked = on;
  });
}
function setStatWin(k) {
  statWin = k;
  xRangeCustom = false;
  try { localStorage.setItem(LS_KEY_STATWIN, k); } catch (e) {}
  // 分段按钮同时决定 x 轴窗口：以前它只影响统计表，图和表的口径对不上
  const w = STAT_WINDOWS.find(x => x.k === k);
  if (!w || w.sec === null || !histData.length) {
    xRange = null;
  } else {
    const last = histData[histData.length - 1].ts * 1000;
    xRange = { min: last - w.sec * 1000, max: last };
  }
  applyXRange();
}

// 线性插值分位数，p 取 0~1
function pctOf(sorted, p) {
  const n = sorted.length;
  if (!n) return null;
  if (n === 1) return sorted[0];
  const idx = (n - 1) * p;
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (idx - lo);
}

// 统计窗口的上界：xRange 设了就用它，否则到最新一个采集点
function statWindowFrom() {
  if (xRange) return xRange.min / 1000;
  const w = STAT_WINDOWS.find(x => x.k === statWin);
  if (!w || w.sec === null || !histData.length) return 0;
  return histData[histData.length - 1].ts - w.sec;
}
function statWindowTo() {
  if (xRange) return xRange.max / 1000;
  return Infinity;
}

// keys 可以是单个 key 字符串，也可以是数组（把多个目标合并统计）
function statFor(keys) {
  if (typeof keys === 'string') keys = [keys];
  const from = statWindowFrom();
  const to = statWindowTo();
  const vals = [];
  let records = 0, lossSum = 0;
  for (let i = 0; i < histData.length; i++) {
    const d = histData[i];
    if (d.ts < from || d.ts > to) continue;
    for (const k of keys) {
      const s = d.series[k];
      if (!s) continue;
      records++;
      if (s.value !== null) vals.push(s.value);
      const st = Number(s.status);
      lossSum += isFinite(st) ? st : (s.value === null ? 100 : 0);
    }
  }
  vals.sort((a, b) => a - b);
  const mean = vals.length ? vals.reduce((x, y) => x + y, 0) / vals.length : null;
  let sd = null;
  if (vals.length > 1) {
    const v = vals.reduce((s, x) => s + (x - mean) * (x - mean), 0) / (vals.length - 1);
    sd = Math.sqrt(v);
  }
  return {
    records, ok: vals.length,
    loss: records ? lossSum / records : null,
    avg: mean, p50: pctOf(vals, .50), p95: pctOf(vals, .95), p99: pctOf(vals, .99),
    max: vals.length ? vals[vals.length - 1] : null, sd
  };
}

function fmtMsCell(v) {
  return v === null ? '—' : (v < 100 ? (Math.round(v * 10) / 10) + '' : Math.round(v) + '');
}

// 阈值配色：超过 warn 橙色，超过 bad 红色。阈值来自配置，可按线路基线调。
function thCls(v, warn, bad) {
  if (v === null || !isFinite(v)) return '';
  if (bad > 0 && v >= bad) return ' lm-bad';
  if (warn > 0 && v >= warn) return ' lm-warn';
  return '';
}

function statRowsFor(tabKey) {
  // overview：每个出口 × 每个目标，一整张表，用 group 做 rowspan 分组
  if (tabKey === 'overview') {
    const rows = [];
    EXITS.forEach(e => {
      const l = labelOf(e.if);
      if (wantsV4(e)) V4_TARGETS.forEach(t => rows.push({ group: l + ' (IPv4)', label: t, keys: e.if + '|' + t }));
      if (wantsV6(e)) V6_TARGETS.forEach(t => rows.push({ group: l + ' (IPv6)', label: t, keys: 'v6-' + e.if + '|' + t }));
    });
    return rows;
  }
  // 出口页的统计表跟曲线区块一一对应，一个区块一张表
  const b = blockByKey(tabKey);
  if (!b) return [];
  const pfx = blockKeyPrefix(b);
  return blockTargets(b).map(t => ({ label: t, keys: pfx + b.iface + '|' + t }));
}

function statCells(r) {
  const s = statFor(r.keys);
  // 丢包率配色：<0.05% 算作干净（不标色）；<1% 用橙色提示；>=1% 才是红色告警。
  // 以前一律 loss>0 就标红，会把四舍五入后显示成 0.0% 的极小值也烧成红色，自相矛盾。
  const lossTxt = s.loss === null ? '—'
    : (s.loss < 0.05 ? '0%'
      : (s.loss < 1 ? s.loss.toFixed(1) : Math.round(s.loss)) + '%');
  const lossCls = (s.loss === null || s.loss < 0.05) ? ''
    : (s.loss < 1 ? ' lm-warn' : ' lm-bad');
  return '<td class="ant-table-cell">' + r.label + '</td>'
    + '<td class="ant-table-cell lm-num">' + s.ok + ' / ' + s.records + '</td>'
    + '<td class="ant-table-cell lm-num' + lossCls + '">' + lossTxt + '</td>'
    + '<td class="ant-table-cell lm-num">' + fmtMsCell(s.avg) + '</td>'
    + '<td class="ant-table-cell lm-num">' + fmtMsCell(s.p50) + '</td>'
    + '<td class="ant-table-cell lm-num">' + fmtMsCell(s.p95) + '</td>'
    + '<td class="ant-table-cell lm-num">' + fmtMsCell(s.p99) + '</td>'
    + '<td class="ant-table-cell lm-num' + thCls(s.max, TH_MAX_WARN, TH_MAX_BAD) + '">' + fmtMsCell(s.max) + '</td>'
    + '<td class="ant-table-cell lm-num' + thCls(s.sd,  TH_SD_WARN,  TH_SD_BAD)  + '">' + fmtMsCell(s.sd) + '</td>';
}

function statTabs() { return ['overview'].concat(allBlocks().map(b => b.key)); }

    const wins = STAT_WINDOWS.map(w =>

    box.className = 'ant-card lm-panel';

      + '<div class="ant-card-body">'
      +   '<div class="ant-table"><div class="ant-table-container"><div class="ant-table-content">'
      +     '<table><thead class="ant-table-thead"><tr class="ant-table-row">'
      +       (showGroup ? '<th class="ant-table-cell">线路</th>' : '')
      +       '<th class="ant-table-cell">目标</th><th class="ant-table-cell">样本(有效/总)</th>'

      +       '<th class="ant-table-cell">p50</th><th class="ant-table-cell">p95</th>'
      +       '<th class="ant-table-cell">p99</th><th class="ant-table-cell">最大</th>'

      +   '</div></div></div>'
      +   '<div class="lm-stat-note">「样本」是窗口内的成功次数 / 总采集次数。丢包率取每次采集的丢包百分比的平均；'
      +   '平均与分位数只统计成功样本，波动σ 是它们的标准差。'
      +   'ICMP 类目标若被运营商限制会显示成高丢包，那是限制不是线路故障。</div>'

  syncStatWinButtons();

// ==================== 数据加载 ====================
// 刷新策略：先用 HEAD 拿一个轻量指纹（Content-Length + Last-Modified），
// 和上次一样就直接返回，只有真出新采集点才去 GET 整个文件。
// 为什么不用 If-None-Match / If-Modified-Since（也就是 fetch 的 cache:'no-cache'）：
// 实测本机的 uhttpd 不认条件请求，带了这两个头照样回 200 + 全量 body，
// 每 15 秒推一次 470KB 的 history.log 是没意义的。HEAD 的响应只有几百字节。
let histErr = 0;
let histSig = '';

async function fetchSig(url) {
  const h = await fetch(url, { method: 'HEAD', cache: 'no-store' });
  if (!h.ok) return null;
  return (h.headers.get('Content-Length') || '?') + '/' + (h.headers.get('Last-Modified') || '?');
}

async function loadHist() {
  try {
    const sig = await fetchSig(HIST_URL);
    if (sig && sig === histSig) return;    // 还没到新的采集点，保持现状
    histSig = sig;
    const r = await fetch(HIST_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    histData = parseHistory(text);
    histErr = 0;
    document.getElementById('lastUpdate').textContent =
      '延迟更新 ' + new Date().toLocaleTimeString() + '（' + histData.length + ' 点）';
    renderOverview();
    Object.keys(chartState).forEach(k => {
      const st = chartState[k];
      if (!st) return;
      if (!st.isLive && st.sliderIdx > histData.length - 1) {
        st.sliderIdx = Math.max(0, histData.length - 1);
      }
      if (st.isLive) st.sliderIdx = Math.max(0, histData.length - 1);
      st.syncTimeline();
      drawChart(k);
      refreshToggleValues(k);
    });
    // 数据范围变了：没设窗口时把手跟着首末时间走，设了窗口就只把把手位置重算一次。
    // 正在拖把手时整套跳过（renderTimeAxis 会重建 DOM，把焦点和拖动一起打断）。
    const dragging = document.activeElement && document.activeElement.classList &&
                     document.activeElement.classList.contains('lm-ta-h');
    if (!dragging) {
      Object.keys(taState).forEach(syncTimeAxis);
      if (!xRange) allBlocks().forEach(b => renderTimeAxis(b.key));
    }
    renderStats();
  } catch (e) {
    histErr++;
    if (histErr === 1) console.warn('history.log 加载失败:', e.message);
    document.getElementById('lastUpdate').textContent = '延迟数据加载失败（' + e.message + '）';
  }
}

let tcpSig = '';
async function loadTcp() {
  try {
    const sig = await fetchSig(TCP_URL);
    if (sig && sig === tcpSig) return;
    tcpSig = sig;
    const r = await fetch(TCP_URL, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    tcpData = await r.json();
    renderTcp();
  } catch (e) { console.warn('tcp.json 加载失败:', e.message); }
}

// config.json 也会变（在设置页存了新配置），但不用轮询得那么勤
async function checkConfig() {
  try {
    const r = await fetch(CONFIG_URL, { cache: 'no-cache' });
    if (r.status === 304 || !r.ok) return;
    const txt = await r.text();
    if (txt === confSig) return;           // 内容没变就别重画
    confSig = txt;
    await loadConfig();          // 内部会重建标签页并重新初始化曲线图
    renderOverview();
    Object.keys(chartState).forEach(k => { drawChart(k); refreshToggleValues(k); });
    renderStats();
    renderTcp();
  } catch (e) { /* 配置读不到就继续用现有值 */ }
}

// 页面切到后台就别轮询了：省路由器、省笔记本电池，回来时立刻补一次
function setupAutoRefresh() {
  const tabVisible = name => !!document.querySelector('#tab-' + name + '.active');
  const start = () => {
    if (histTimer) return;
    loadHist();
    if (tabVisible('tcp')) loadTcp();
    histTimer = setInterval(loadHist, HIST_REFRESH);
    tcpTimer  = setInterval(() => { if (tabVisible('tcp')) loadTcp(); }, TCP_REFRESH);
    confTimer = setInterval(checkConfig, CONF_REFRESH);
  };
  const stop = () => {
    clearInterval(histTimer); histTimer = 0;
    clearInterval(tcpTimer);  tcpTimer = 0;
    clearInterval(confTimer); confTimer = 0;
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stop();
    else start();
  });
  start();
}

// ==================== 标签切换 ====================
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('#mainTabs .ant-tabs-tab').forEach(t => {
    const on = t.dataset.tab === name;
    t.classList.toggle('ant-tabs-tab-active', on);
    const btn = t.querySelector('.ant-tabs-tab-btn');
    if (btn) btn.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('.lm-pane').forEach(t => t.classList.toggle('active', t.id === 'tab-' + name));
  // 切回的图表需要重算尺寸（canvas 在隐藏容器里尺寸算不出来）。
  // 一个出口页里可能有 IPv4 / IPv6 两张图，都要 resize。
  setTimeout(() => {
    blocksOfTab(name).forEach(b => { if (charts[b.key]) charts[b.key].resize(); });
    if (name === 'overview') { charts.barChart?.resize(); sparkCharts.forEach(c => c.resize()); }
  }, 0);
}
['fService','fIface','fClient'].forEach(id => document.getElementById(id).addEventListener('input', renderTcp));

// ==================== 启动 ====================
// 必须先拿到 config.json 再建图：曲线名字、出口名、出口类型都来自配置
// （标签页、图表、事件绑定都在 loadConfig → buildTabs 里完成）
(async function boot() {
  await loadConfig();
  smoothOn = loadSmooth();
  applySmooth();          // 把记住的平滑状态应用到刚建好的图上
  loadStatWin();
  renderStats();
  loadHist();
  loadTcp();
  setupAutoRefresh();
})();
</script>
